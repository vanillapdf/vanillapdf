# This is a basic workflow to help you get started with Actions

name: Sanity check

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

# Enable only minimum required permissions
permissions:
  contents: read

env:
  VCPKG_ROOT: "external/vcpkg"
  VCPKG_DISABLE_METRICS: 1 # vcpkg is by default sending build metrics, we do not need it here

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  sanity-check:
    name: sanity-check-${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # We would like to see the results of all jobs even in case one of them fails
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-latest]
        build_type: [Release]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Bootstrap vcpkg on Windows
      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: ${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.bat
        shell: cmd

      # Bootstrap vcpkg on Linux
      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: ${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh
        shell: bash

      # Bootstrap vcpkg on macOS
      - name: Bootstrap vcpkg (macOS)
        if: runner.os == 'macOS'
        run: ${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh
        shell: bash

      # Generate the build files
      - name: Generate build files
        run: cmake -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake .

      # Build the project
      - name: Build project in config ${{ matrix.build_type }}
        run: cmake --build . --config ${{ matrix.build_type }}

      # Run tests
      - name: Run automated test scenarios in config ${{ matrix.build_type }}
        run: ctest --build-config ${{ matrix.build_type }}
