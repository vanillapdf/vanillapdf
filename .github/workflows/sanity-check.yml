# This is a basic workflow to help you get started with Actions

name: Sanity check

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

# Enable only minimum required permissions
permissions:
  contents: read

env:
  VCPKG_ROOT: "external/vcpkg"
  VCPKG_DISABLE_METRICS: 1 # vcpkg is by default sending build metrics, we do not need it here

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  sanity-check:
    name: sanity-check-${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # We would like to see the results of all jobs even in case one of them fails
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-latest]
        build_type: [Release]
        include:
          - os: ubuntu-latest
            bootstrap_cmd: "${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh"
            shell: bash

          - os: macos-13
            bootstrap_cmd: "${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh"
            shell: bash

          - os: macos-latest
            bootstrap_cmd: "${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh"
            shell: bash

          - os: windows-latest
            bootstrap_cmd: "${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.bat"
            shell: cmd

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Bootstrap vcpkg
      - name: Bootstrap vcpkg
        run: ${{ matrix.bootstrap_cmd }}
        shell: ${{ matrix.shell }}

      # Generate the build files
      - name: Generate build files
        run: cmake -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake .

      # Build the project
      - name: Build project in config ${{ matrix.build_type }}
        run: cmake --build . --config ${{ matrix.build_type }}

      # Run tests
      - name: Run automated test scenarios in config ${{ matrix.build_type }}
        run: ctest --build-config ${{ matrix.build_type }}
