# This is a basic workflow to help you get started with Actions

name: Sanity check

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

# Enable only minimum required permissions
permissions:
  contents: read

env:
  VCPKG_ROOT: "external/vcpkg"
  VCPKG_DISABLE_METRICS: 1 # vcpkg is by default sending build metrics, we do not need it here
  BUILD_DIR: build

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  sanity-check:
    name: sanity-check-${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # We would like to see the results of all jobs even in case one of them fails
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            cmake_preset: linux-x64-gcc
          
          - os: macos-latest
            cmake_preset: macos-arm64
          
          - os: macos-13
            cmake_preset: macos-x64
          
          - os: windows-latest
            cmake_preset: windows-x64-msvc

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Bootstrap vcpkg on Windows
      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: ${{ github.workspace }}\\external\\vcpkg\\bootstrap-vcpkg.bat
        shell: cmd

      # Bootstrap vcpkg on Linux
      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: ${{ github.workspace }}/external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      # Bootstrap vcpkg on macOS
      - name: Bootstrap vcpkg (macOS)
        if: runner.os == 'macOS'
        run: ${{ github.workspace }}/external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      # Generate the build files
      - name: Generate build files
        run: |
          cmake \
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
          -B ${{ env.BUILD_DIR }} \
          -S .

      # Build the project
      - name: Build project in config ${{ matrix.build_type }}
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ matrix.build_type }}

      # Run tests
      - name: Run automated test scenarios in config ${{ matrix.build_type }}
        run: ctest --build-config ${{ matrix.build_type }} --test-dir ${{ env.BUILD_DIR }}
