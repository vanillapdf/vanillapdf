# This is a basic workflow to help you get started with Actions

name: Sanity check

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Run workflow on any push into main branch
  push:
    branches: [ "main", "release/*" ]
    paths:
      - '.github/workflows/sanity-check.yml'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'vcpkg.json.in'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'test/**'

  # Run workflow when there is a pull request towards main branch
  pull_request:
    branches: [ "main", "release/*" ]
    paths:
      - '.github/workflows/sanity-check.yml'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'vcpkg.json.in'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'test/**'

permissions:
  contents: read    # Download the repository source code
  packages: read    # Needed to load container images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: external/vcpkg
  VCPKG_DISABLE_METRICS: 1 # vcpkg is by default sending build metrics, we do not need it here

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  linux:
    name: ${{ matrix.config.name }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false # We would like to see the results of all jobs even in case one of them fails
      max-parallel: 4

      matrix:
        build_type: [Debug, Release]

        config:
          - name: rocky.9-x64
            os: ubuntu-24.04
            image: ghcr.io/vanillapdf/vanillapdf-rockylinux-amd64:9
            platform: linux/amd64
            preset: linux-x64-gcc

          - name: rocky.9-arm64
            os: ubuntu-24.04-arm
            image: ghcr.io/vanillapdf/vanillapdf-rockylinux-arm64v8:9
            platform: linux/arm64
            preset: linux-arm64-gcc

          - name: ubuntu.24.04-x64
            os: ubuntu-24.04
            image: ghcr.io/vanillapdf/vanillapdf-ubuntu-amd64:24.04
            platform: linux/amd64
            preset: linux-x64-gcc

          - name: ubuntu.24.04-arm64
            os: ubuntu-24.04-arm
            image: ghcr.io/vanillapdf/vanillapdf-ubuntu-arm64v8:24.04
            platform: linux/arm64
            preset: linux-arm64-gcc

    container:
      image: ${{ matrix.config.image }}
      options: --platform=${{ matrix.config.platform }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            build/${{ matrix.config.preset }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ matrix.config.name }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.name }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-${{ matrix.config.name }}-

      # Bootstrap vcpkg on Linux
      - name: Bootstrap vcpkg (Linux)
        run: ./external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Generate build files
        run: cmake --preset ${{ matrix.config.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DVANILLAPDF_ENABLE_TESTS=ON

      - name: Verify vcpkg does not prefer system libs (macOS)
        if: runner.os == 'macOS'
        run: |
          CACHE_FILE="build/${{ matrix.config.preset }}/CMakeCache.txt"
          python3 - <<'PY'
          import os, sys
          cache_file = os.environ.get("CACHE_FILE")
          if not cache_file:
              print("CACHE_FILE env var not set", file=sys.stderr)
              sys.exit(2)
          with open(cache_file, "r", encoding="utf-8") as f:
              cache = f.read()
          needle = "VCPKG_PREFER_SYSTEM_LIBS:BOOL=OFF"
          if needle not in cache:
              print(f"Expected '{needle}' in {cache_file} but it was not found.", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {needle}")
          PY

      - name: Build
        run: cmake --build --preset ${{ matrix.config.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.config.preset }} --output-on-failure


  windows:
    name: ${{ matrix.config.name }} - ${{ matrix.build_type }}
    runs-on: windows-2025

    strategy:
      fail-fast: false # We would like to see the results of all jobs even in case one of them fails
      max-parallel: 4

      matrix:

        # There are some issues with win-x86 in debug, that prevent us to use it
        build_type: [Release]

        config:
          - name: win.2025-x86
            preset: windows-x86-msvc-17

          - name: win.2025-x64
            preset: windows-x64-msvc-17

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            build/${{ matrix.config.preset }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ matrix.config.name }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.name }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-${{ matrix.config.name }}-

      # Bootstrap vcpkg on Windows
      - name: Bootstrap vcpkg (Windows)
        run: ${{ github.workspace }}\\external\\vcpkg\\bootstrap-vcpkg.bat

      - name: Generate build files ${{ matrix.config.preset }}
        run: cmake --preset ${{ matrix.config.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DVANILLAPDF_ENABLE_TESTS=ON

      - name: Build ${{ matrix.config.preset }}
        run: cmake --build --preset ${{ matrix.config.preset }} --config ${{ matrix.build_type }}

      - name: Test ${{ matrix.config.preset }}
        run: ctest --preset ${{ matrix.config.preset }} -C ${{ matrix.build_type }} --output-on-failure

  macos:
    name: ${{ matrix.config.name }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.config.runner }}

    strategy:
      fail-fast: false # We would like to see the results of all jobs even in case one of them fails
      max-parallel: 4

      matrix:
        build_type: [Debug, Release]

        config:
          - name: osx.15-x64
            runner: macos-15-intel
            preset: macos-x64

          - name: osx.15-arm64
            runner: macos-15
            preset: macos-arm64

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            build/${{ matrix.config.preset }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ matrix.config.name }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.name }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-${{ matrix.config.name }}-

      - name: Install build tools (macOS)
        run: brew install --quiet autoconf automake autoconf-archive

      # Bootstrap vcpkg on macOS
      - name: Bootstrap vcpkg (macOS)
        run: ${{ github.workspace }}/external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Generate build files
        run: cmake --preset ${{ matrix.config.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DVANILLAPDF_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.config.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.config.preset }} --output-on-failure
