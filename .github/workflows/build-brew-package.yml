name: Build Homebrew package

on:
  workflow_call:
    inputs:
      build_suffix:
        description: "Build suffix (e.g. -rc1)"
        required: false
        type: string
        default: ''

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    name: Build package
    runs-on: macos-26
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install system dependencies
        run: |
          brew update
          brew install ninja openssl@3 jpeg-turbo zlib openjpeg spdlog nlohmann-json googletest

      - name: Configure
        run: |
          cmake --preset macos-arm64 -DCMAKE_BUILD_TYPE=Release \
            -DVANILLAPDF_INTERNAL_VCPKG=OFF \
            -DVANILLAPDF_ENABLE_PACKAGING=ON \
            -DVANILLAPDF_ENABLE_TESTS=ON \
            -DVANILLAPDF_ENABLE_ENCRYPTION=ON -DVANILLAPDF_EXTERNAL_OPENSSL=ON \
            -DVANILLAPDF_ENABLE_JPEG=ON -DVANILLAPDF_EXTERNAL_JPEG=ON \
            -DVANILLAPDF_ENABLE_JPEG2000=ON -DVANILLAPDF_EXTERNAL_OPENJPEG=ON \
            -DVANILLAPDF_ENABLE_ZLIB=ON -DVANILLAPDF_EXTERNAL_ZLIB=ON \
            -DVANILLAPDF_EXTERNAL_SPDLOG=ON \
            -DVANILLAPDF_EXTERNAL_NLOHMANN_JSON=ON \
            -DVANILLAPDF_EXTERNAL_GTEST=ON \
            -DVANILLAPDF_VERSION_BUILD_SUFFIX=${{ inputs.build_suffix }}

      - name: Build
        run: cmake --build --preset macos-arm64

      - name: Test
        run: ctest --preset macos-arm64

      - name: Package
        run: cmake --build --preset macos-arm64 --target package

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vanillapdf-dmg
          path: build/macos-arm64/*.dmg
