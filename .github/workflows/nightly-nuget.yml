name: Nightly NuGet Packages

on:
  schedule:
    - cron: '0 3 * * *'  # Every day at 03:00 UTC

  workflow_dispatch:

permissions:
  contents: write  # Needed for future GitHub release or content access

env:
  VCPKG_DISABLE_METRICS: 1
  VCPKG_ROOT: external/vcpkg

jobs:
  build:
    name: Build & Package (${{ matrix.config.PLATFORM_IDENTIFIER }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: windows-latest, platform: "Win32", rid: win-x86, cmake_args: '-DCMAKE_GENERATOR_PLATFORM=Win32 -G "Visual Studio 17 2022"' }
          - { os: windows-latest, platform: "x64", rid: win-x64, cmake_args: '-DCMAKE_GENERATOR_PLATFORM=x64 -G "Visual Studio 17 2022"' }
          - { os: macos-13,         platform: "x64", rid: osx-x64, cmake_args: "" }
          - { os: ubuntu-latest,    platform: "x64", rid: linux-x64, cmake_args: "", container: 'ghcr.io/vanillapdf/vanillapdf-rockylinux-amd64:9' }
          - { os: ubuntu-latest,    platform: "arm64", rid: linux-arm64, cmake_args: "", container: 'ghcr.io/vanillapdf/vanillapdf-rockylinux-arm64v8:9' }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg installed
        uses: actions/cache@v4
        with:
          path: |
            build/vcpkg_installed
            external/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ matrix.cmake_preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.cmake_preset }}-
            vcpkg-${{ runner.os }}-

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install mono

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mono-complete

      # Cross-platform vcpkg bootstrap handling
      - name: Bootstrap vcpkg
        uses: ./.github/actions/bootstrap-vcpkg

      - name: Set nightly version suffix
        run: echo "DATE_SUFFIX=-nightly-$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Configure CMake
        run: |
          cmake . \
            -DPLATFORM_IDENTIFIER=${{ matrix.config.rid }} \
            -DVANILLAPDF_VERSION_BUILD_SUFFIX=${{ env.DATE_SUFFIX }} \
            ${{ matrix.config.cmake_args }}

      - name: Build
        run: cmake --build . --config Release

      - name: Test
        run: ctest --output-on-failure -C Release

      - name: Build package
        run: nuget pack nuget/vanillapdf.runtime.nuspec

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-${{ matrix.config.rid }}
          path: |
            *.nupkg

  build-vanillapdf-core:
    name: Build Vanilla.PDF Core NuGet Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Download nuget.exe
        run: curl -L -o nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe

      - name: Set nightly version suffix
        run: echo "DATE_SUFFIX=-nightly-$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Configure CMake
        run: cmake . -DVANILLAPDF_VERSION_BUILD_SUFFIX=${{ env.DATE_SUFFIX }}

      - name: Build NuGet package
        run: nuget pack nuget/vanillapdf.nuspec

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-core
          path: |
            *.nupkg
