name: Nightly NuGet Packages

on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Run workflow on any push into main branch
  # only there was a change in the workflow file
  push:
    branches: [ "main", "release/*" ]
    paths:
      - '.github/workflows/nightly-nuget.yml'
      - 'vcpkg.json.in'

  # Run workflow when there is a pull request towards main branch
  # only there was a change in the workflow file
  pull_request:
    branches: [ "main", "release/*" ]
    paths:
      - '.github/workflows/nightly-nuget.yml'
      - 'vcpkg.json.in'

  schedule:
    - cron: '0 3 * * *'  # Every day at 03:00 UTC

permissions: {}

jobs:

  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Check for commits in the last 24 hours
        id: check
        run: |
          # For non-scheduled runs, always build
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Non-scheduled run, proceeding with build"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check for commits in the last 24 hours
          COMMIT_COUNT=$(git rev-list --count --since="24 hours ago" HEAD)
          echo "Commits in the last 24 hours: ${COMMIT_COUNT}"

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No commits in the last 24 hours, skipping build"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found ${COMMIT_COUNT} commits, proceeding with build"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  prepare-suffix:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    outputs:
      nightly_suffix: ${{ steps.set-suffix.outputs.nightly_suffix }}
      build_date: ${{ steps.set-suffix.outputs.build_date }}

    steps:
      - name: Set nightly version suffix
        id: set-suffix
        run: |
          # Prefer GITHUB_HEAD_REF (for PRs or workflow_dispatch), fallback to ref name
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF##*/}}"
          # Lowercase, replace any non [0-9a-z] with nothing, to create clean identifier
          CLEAN_NAME=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^0-9a-z]+//g')
          # Fallback in the unlikely case the cleaned name is empty
          if [ -z "$CLEAN_NAME" ]; then CLEAN_NAME="branch"; fi
          DATE=$(date +'%Y%m%d')
          # Format: nightly.branch (e.g., nightly.main), date goes to build version
          echo "nightly_suffix=nightly.${CLEAN_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_date=${DATE}" >> "$GITHUB_OUTPUT"

  build-nuget:
    needs: [check-changes, prepare-suffix]
    if: needs.check-changes.outputs.has_changes == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-nuget.yml
    with:
      build_suffix: ${{ needs.prepare-suffix.outputs.nightly_suffix }}
      patch_override: "999"
      build_override: ${{ needs.prepare-suffix.outputs.build_date }}

  push-nuget-staging:
    name: Push NuGet Packages
    runs-on: ubuntu-latest
    permissions:
      packages: write
    environment:
      name: staging

    needs: [check-changes, build-nuget]
    if: needs.check-changes.outputs.has_changes == 'true'
    steps:
      - name: Download all NuGet artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: ./nupkgs

      - name: Push all .nupkg to GitHub Packages
        run: |
          dotnet nuget push nupkgs/**/*.nupkg \
            --source "${{ vars.NUGET_SOURCE }}" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
