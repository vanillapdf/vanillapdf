name: Nightly NuGet Packages

on:
  schedule:
    - cron: '0 3 * * *'  # Every day at 03:00 UTC

  workflow_dispatch:

permissions:
  contents: write  # Needed for future GitHub release or content access

env:
  VCPKG_DISABLE_METRICS: 1
  VCPKG_ROOT: external/vcpkg

jobs:
  build:
    name: Build & Package on ${{ matrix.config.preset }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: windows-latest, preset: "windows-x64-msvc-release" }
          - { os: macos-13,       preset: "macos-x64-release" }
          - { os: macos-latest,   preset: "macos-arm64-release" }
          - { os: ubuntu-latest,  preset: "linux-x64-gcc-release", container: 'ghcr.io/vanillapdf/vanillapdf-rockylinux-amd64:9' }
          - { os: ubuntu-latest,  preset: "linux-arm64-gcc-release", container: 'ghcr.io/vanillapdf/vanillapdf-rockylinux-arm64v8:9' }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg installed
        uses: actions/cache@v4
        with:
          path: |
            build/vcpkg_installed
            external/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mono-complete

      # Cross-platform vcpkg bootstrap handling
      - name: Bootstrap vcpkg
        uses: ./.github/actions/bootstrap-vcpkg

      - name: Set nightly version suffix
        run: echo "DATE_SUFFIX=-nightly-$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Configure CMake
        run: |
          cmake . \
            -DPLATFORM_IDENTIFIER=${{ matrix.config.preset }} \
            -DVANILLAPDF_VERSION_BUILD_SUFFIX=${{ env.DATE_SUFFIX }} \
            ${{ matrix.config.cmake_args }}

      - name: Configure CMake
        run: cmake --preset ${{ matrix.config.preset }} -DVANILLAPDF_VERSION_BUILD_SUFFIX=${{ env.DATE_SUFFIX }}
        
      - name: Build
        run: cmake --build --preset ${{ matrix.config.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.config.preset }}

      - name: Build package
        run: nuget pack nuget/vanillapdf.runtime.nuspec

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanillapdf-runtime-nightly-nuget-${{ matrix.config.preset }}
          path: |
            *.nupkg

  build-vanillapdf-core:
    name: Build Vanilla.PDF Core NuGet Package
    runs-on: windows-latest
    
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: windows-latest, preset: "windows-x64-msvc-release" }
          
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg installed
        uses: actions/cache@v4
        with:
          path: |
            build/vcpkg_installed
            external/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-
          
      - name: Download nuget.exe
        run: curl -L -o nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe

      - name: Set nightly version suffix
        run: echo "DATE_SUFFIX=-nightly-$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Configure CMake
        run: cmake . -DVANILLAPDF_VERSION_BUILD_SUFFIX=${{ env.DATE_SUFFIX }}

      - name: Build NuGet package
        run: nuget pack nuget/vanillapdf.nuspec

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanillapdf-nightly-nuget
          path: |
            *.nupkg
