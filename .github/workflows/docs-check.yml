name: Doxygen build check

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/github-pages.yml'
      - '.github/workflows/docs-check.yml'
      - 'doc/doxyfile.in'
      - 'cmake/**'
      - 'CMakeLists.txt'
  pull_request:
    branches: ["main"]
    paths:
      - '.github/workflows/github-pages.yml'
      - '.github/workflows/docs-check.yml'
      - 'doc/doxyfile.in'
      - 'cmake/**'
      - 'CMakeLists.txt'

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Generate doxyfile
        run: cmake -P cmake/docs.cmake
      - name: Build Doxygen
        run: doxygen doxyfile
        working-directory: doc
