name: Build Debian package

on:
  workflow_call:
    inputs:
      build_suffix:
        description: "Build suffix (e.g. -rc1)"
        required: false
        type: string
        default: ''

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libjpeg-turbo8 libjpeg-turbo8-dev zlib1g-dev libopenjp2-7-dev libopenjp2-tools

      - name: Configure
        run: |
          cmake --preset linux-x64-gcc -DCMAKE_BUILD_TYPE=Release \
            -DVANILLAPDF_ENABLE_PACKAGING=ON \
            -DVANILLAPDF_ENABLE_TESTS=ON \
            -DVANILLAPDF_ENABLE_ENCRYPTION=ON -DVANILLAPDF_EXTERNAL_OPENSSL=ON \
            -DVANILLAPDF_ENABLE_JPEG=ON -DVANILLAPDF_EXTERNAL_JPEG=ON \
            -DVANILLAPDF_ENABLE_JPEG2000=ON -DVANILLAPDF_EXTERNAL_OPENJPEG=ON \
            -DVANILLAPDF_ENABLE_ZLIB=ON -DVANILLAPDF_EXTERNAL_ZLIB=ON \
            -DVANILLAPDF_EXTERNAL_SPDLOG=OFF \
            -DVANILLAPDF_EXTERNAL_NLOHMANN_JSON=OFF \
            -DDETECT_CUSTOM_LINUX_DISTRIBUTION=ON \
            -DVANILLAPDF_ENABLE_TESTS=ON -DVANILLAPDF_EXTERNAL_GTEST=OFF \
            -DVANILLAPDF_VERSION_BUILD_SUFFIX=${{ inputs.build_suffix }}

      - name: Build
        run: cmake --build --preset linux-x64-gcc

      - name: Test
        run: ctest --preset linux-x64-gcc

      - name: Package
        run: cmake --build --preset linux-x64-gcc --target package

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vanillapdf-deb
          path: build/linux-x64-gcc/*.deb

  install-package:
    name: Install package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build-package
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vanillapdf-deb
          path: ./pkg

      - name: Install .deb
        run: |
          sudo apt-get update
          sudo apt-get install -y ./pkg/*.deb
          sudo ldconfig

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Consume the installed package
        run: |
          sudo apt-get install -y cmake g++
          cmake -B build-consumer -S examples/system-package-integration
          cmake --build build-consumer
          ctest --test-dir build-consumer --output-on-failure
