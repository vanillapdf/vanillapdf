name: Signature interoperability check (pdfsig + pyhanko)

on:
  workflow_dispatch:

  pull_request:
    branches: [ "main", "release/*" ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/certificates/**'
      - 'test/example.pdf'
      - '.github/workflows/signature-interop-check.yml'

  schedule:
    - cron: '0 5 * * 1'  # Every Monday at 5 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  VCPKG_ROOT: external/vcpkg
  VCPKG_DISABLE_METRICS: 1

jobs:

  interop:
    name: ubuntu.24.04-x64
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/vanillapdf/vanillapdf-ubuntu-amd64:24.04
      options: --platform=linux/amd64

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            build/linux-x64-gcc/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
          key: vcpkg-${{ runner.os }}-ubuntu.24.04-x64-linux-x64-gcc-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-ubuntu.24.04-x64-linux-x64-gcc-

      - name: Install pdfsig and pyhanko
        run: |
          apt-get update && apt-get install -y poppler-utils libnss3-tools python3-pip
          pip3 install pyHanko --break-system-packages

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh

      - name: Configure
        run: cmake --preset linux-x64-gcc -DCMAKE_BUILD_TYPE=Release -DVANILLAPDF_ENABLE_TESTS=OFF -DVANILLAPDF_ENABLE_BENCHMARK=OFF

      - name: Build vanillapdf.tools
        run: cmake --build --preset linux-x64-gcc --target vanillapdf.tools

      - name: Install vanillapdf.tools
        run: cmake --install build/linux-x64-gcc --prefix install

      - name: Initialize NSS database for pdfsig
        run: mkdir -p /tmp/nssdb && certutil -N --empty-password -d sql:/tmp/nssdb

      - name: Export trust anchors from test certificates
        run: |
          mkdir -p /tmp/trust
          echo -n "test" > /tmp/pass.txt
          for cert in Test_4kRSA_SHA3_512 Test_EC384_SHA512 Test_ED25519 Test_ED448; do
            openssl pkcs12 -in test/certificates/${cert}.pfx -nokeys -passin pass:test 2>/dev/null \
              | openssl x509 > /tmp/trust/${cert}.pem
          done

      # ================================================================
      # Forward: vanillapdf.tools signs → pdfsig verifies (DSA, ECDSA)
      # NSS 3.98 (Ubuntu 24.04) supports SHA-2 but not SHA-3 or EdDSA.
      # RSA-SHA3, Ed25519, Ed448 are covered by pyhanko below.
      # ================================================================

      - name: "[vanillapdf→pdfsig] Sign 2k-DSA-SHA256"
        run: install/bin/vanillapdf.tools sign -s test/example.pdf -d /tmp/vp_dsa.pdf -k test/certificates/Test_2kDSA_SHA256.pfx -p test

      - name: "[vanillapdf→pdfsig] Verify 2k-DSA-SHA256"
        run: |
          pdfsig -nssdir sql:/tmp/nssdb -nocert /tmp/vp_dsa.pdf | grep "Signature Validation: Valid"

      - name: "[vanillapdf→pdfsig] Sign EC-384-SHA512"
        run: install/bin/vanillapdf.tools sign -s test/example.pdf -d /tmp/vp_ec.pdf -k test/certificates/Test_EC384_SHA512.pfx -p test

      - name: "[vanillapdf→pdfsig] Verify EC-384-SHA512"
        run: |
          pdfsig -nssdir sql:/tmp/nssdb -nocert /tmp/vp_ec.pdf | grep "Signature Validation: Valid"

      # ================================================================
      # Forward: vanillapdf.tools signs → pyhanko verifies (all 4)
      # pyhanko uses OpenSSL and supports SHA-3 and EdDSA.
      # EC file is reused from the pdfsig step above.
      # ================================================================

      - name: "[vanillapdf→pyhanko] Sign RSA-4k-SHA3-512"
        run: install/bin/vanillapdf.tools sign -s test/example.pdf -d /tmp/vp_rsa.pdf -k test/certificates/Test_4kRSA_SHA3_512.pfx -p test

      - name: "[vanillapdf→pyhanko] Verify RSA-4k-SHA3-512"
        run: pyhanko sign validate --trust /tmp/trust/Test_4kRSA_SHA3_512.pem --trust-replace --no-revocation-check --pretty-print /tmp/vp_rsa.pdf

      - name: "[vanillapdf→pyhanko] Verify EC-384-SHA512"
        run: pyhanko sign validate --trust /tmp/trust/Test_EC384_SHA512.pem --trust-replace --no-revocation-check --pretty-print /tmp/vp_ec.pdf

      - name: "[vanillapdf→pyhanko] Sign Ed25519"
        run: install/bin/vanillapdf.tools sign -s test/example.pdf -d /tmp/vp_ed25519.pdf -k test/certificates/Test_ED25519.pfx -p test

      - name: "[vanillapdf→pyhanko] Verify Ed25519"
        run: pyhanko sign validate --trust /tmp/trust/Test_ED25519.pem --trust-replace --no-revocation-check --pretty-print /tmp/vp_ed25519.pdf

      - name: "[vanillapdf→pyhanko] Sign Ed448"
        run: install/bin/vanillapdf.tools sign -s test/example.pdf -d /tmp/vp_ed448.pdf -k test/certificates/Test_ED448.pfx -p test

      - name: "[vanillapdf→pyhanko] Verify Ed448"
        run: pyhanko sign validate --trust /tmp/trust/Test_ED448.pem --trust-replace --no-revocation-check --pretty-print /tmp/vp_ed448.pdf

      # ================================================================
      # Reverse: pyhanko signs → vanillapdf.tools verifies (all 4)
      # Trust anchors loaded from /tmp/trust/ via -c flag.
      # ================================================================

      - name: "[pyhanko→vanillapdf] Sign RSA-4k-SHA3-512"
        run: pyhanko sign addsig --field "1/0,0,200,200/Signature1" pkcs12 --passfile /tmp/pass.txt test/example.pdf /tmp/ph_rsa.pdf test/certificates/Test_4kRSA_SHA3_512.pfx

      - name: "[pyhanko→vanillapdf] Verify RSA-4k-SHA3-512"
        run: install/bin/vanillapdf.tools verify -f /tmp/ph_rsa.pdf -c /tmp/trust

      - name: "[pyhanko→vanillapdf] Sign EC-384-SHA512"
        run: pyhanko sign addsig --field "1/0,0,200,200/Signature1" pkcs12 --passfile /tmp/pass.txt test/example.pdf /tmp/ph_ec.pdf test/certificates/Test_EC384_SHA512.pfx

      - name: "[pyhanko→vanillapdf] Verify EC-384-SHA512"
        run: install/bin/vanillapdf.tools verify -f /tmp/ph_ec.pdf -c /tmp/trust

      - name: "[pyhanko→vanillapdf] Sign Ed25519"
        run: pyhanko sign addsig --field "1/0,0,200,200/Signature1" pkcs12 --passfile /tmp/pass.txt test/example.pdf /tmp/ph_ed25519.pdf test/certificates/Test_ED25519.pfx

      - name: "[pyhanko→vanillapdf] Verify Ed25519"
        run: install/bin/vanillapdf.tools verify -f /tmp/ph_ed25519.pdf -c /tmp/trust

      - name: "[pyhanko→vanillapdf] Sign Ed448"
        run: pyhanko sign addsig --field "1/0,0,200,200/Signature1" pkcs12 --passfile /tmp/pass.txt test/example.pdf /tmp/ph_ed448.pdf test/certificates/Test_ED448.pfx

      - name: "[pyhanko→vanillapdf] Verify Ed448"
        run: install/bin/vanillapdf.tools verify -f /tmp/ph_ed448.pdf -c /tmp/trust
