name: Encryption interoperability check (qpdf + pyhanko)

on:
  workflow_dispatch:

  pull_request:
    branches: [ "main", "release/*" ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'scripts/verify_encryption_interop_pyhanko.py'
      - 'scripts/verify_encryption_interop_qpdf.py'
      - '.github/workflows/encryption-interop-check.yml'

  schedule:
    - cron: '0 5 * * 1'  # Every Monday at 5 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  VCPKG_ROOT: external/vcpkg
  VCPKG_DISABLE_METRICS: 1
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/external/vcpkg/bincache,readwrite"

jobs:

  pyhanko:
    name: pyhanko / ubuntu.26.04-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/vanillapdf/vanillapdf-ubuntu:26.04
      options: --platform=linux/amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            external/vcpkg/downloads
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-ubuntu.26.04-x64-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-ubuntu.26.04-x64-

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh

      - name: Configure
        run: cmake --preset linux-x64-gcc -DCMAKE_BUILD_TYPE=Release

      - name: Build vanillapdf.tools
        run: cmake --build --preset linux-x64-gcc --target vanillapdf.tools

      - name: Install vanillapdf.tools
        run: cmake --install build/linux-x64-gcc --prefix install

      # Forward: vanillapdf.tools encrypts -> pyhanko authenticates and decrypts.
      - name: "[vanillapdf->pyhanko] RC4-40 encryption interop"
        run: python3 scripts/verify_encryption_interop_pyhanko.py install/bin/vanillapdf.tools fixtures/flat-pages.pdf /tmp/interop RC4 40

      - name: "[vanillapdf->pyhanko] RC4-128 encryption interop"
        run: python3 scripts/verify_encryption_interop_pyhanko.py install/bin/vanillapdf.tools fixtures/flat-pages.pdf /tmp/interop RC4 128

      - name: "[vanillapdf->pyhanko] AES-128 encryption interop"
        run: python3 scripts/verify_encryption_interop_pyhanko.py install/bin/vanillapdf.tools fixtures/flat-pages.pdf /tmp/interop AES 128

      - name: "[vanillapdf->pyhanko] AES-256 encryption interop"
        run: python3 scripts/verify_encryption_interop_pyhanko.py install/bin/vanillapdf.tools fixtures/flat-pages.pdf /tmp/interop AES 256

  qpdf:
    name: qpdf / ubuntu.26.04-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/vanillapdf/vanillapdf-ubuntu:26.04
      options: --platform=linux/amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            external/vcpkg/downloads
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-ubuntu.26.04-x64-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-ubuntu.26.04-x64-

      - name: Install qpdf
        run: apt-get update && apt-get install -y qpdf

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh

      - name: Configure
        run: cmake --preset linux-x64-gcc -DCMAKE_BUILD_TYPE=Release

      - name: Build vanillapdf.tools
        run: cmake --build --preset linux-x64-gcc --target vanillapdf.tools

      - name: Install vanillapdf.tools
        run: cmake --install build/linux-x64-gcc --prefix install

      # Forward: vanillapdf.tools encrypts -> qpdf decrypts.
      - name: "[vanillapdf->qpdf] RC4-40 encryption interop"
        run: python3 scripts/verify_encryption_interop_qpdf.py install/bin/vanillapdf.tools fixtures/flat-pages.pdf /tmp/interop RC4 40

      # Sub-128-bit RC4 keys use the revision-3 handler (V=2/R=3). These exercise the
      # n = key_length/8 truncation in Algorithm 2/3 key derivation, which the 40- and
      # 128-bit cases (n = 5 with R=2, and n = 16) cannot. qpdf handles arbitrary RC4
      # key lengths; pyHanko's cryptography backend rejects non-standard RC4 key sizes,
      # so these intermediate lengths are qpdf-only.
      - name: "[vanillapdf->qpdf] RC4-56 encryption interop"
        run: python3 scripts/verify_encryption_interop_qpdf.py install/bin/vanillapdf.tools fixtures/flat-pages.pdf /tmp/interop RC4 56

      - name: "[vanillapdf->qpdf] RC4-80 encryption interop"
        run: python3 scripts/verify_encryption_interop_qpdf.py install/bin/vanillapdf.tools fixtures/flat-pages.pdf /tmp/interop RC4 80

      - name: "[vanillapdf->qpdf] RC4-128 encryption interop"
        run: python3 scripts/verify_encryption_interop_qpdf.py install/bin/vanillapdf.tools fixtures/flat-pages.pdf /tmp/interop RC4 128

      # AES runs against sample-document.pdf, which carries streams with an array /Filter
      # (/Filter [ /FlateDecode ]). flat-pages.pdf is stream-less, so it never reaches the
      # stream path where issue #460 lived: the body was written unencrypted while /Length
      # recorded the encrypted size, which qpdf rejects on decrypt. This fixture also covers
      # the plain algorithm/method check, so a separate stream-less AES case would be redundant.
      - name: "[vanillapdf->qpdf] AES-128 encryption interop (array-filter stream)"
        run: python3 scripts/verify_encryption_interop_qpdf.py install/bin/vanillapdf.tools fixtures/sample-document.pdf /tmp/interop AES 128

      - name: "[vanillapdf->qpdf] AES-256 encryption interop (array-filter stream)"
        run: python3 scripts/verify_encryption_interop_qpdf.py install/bin/vanillapdf.tools fixtures/sample-document.pdf /tmp/interop AES 256
