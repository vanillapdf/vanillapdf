# This is a basic workflow to help you get started with Actions

name: Sanity check

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Run workflow on any push into main branch
  push:
    branches: [ "main", "release/*" ]
    paths:
      - '.github/workflows/testing/sanity-check.yml'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'vcpkg.json'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'test/**'

  # Run workflow when there is a pull request towards main branch
  pull_request:
    branches: [ "main", "release/*" ]
    paths:
      - '.github/workflows/testing/sanity-check.yml'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'vcpkg.json'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'test/**'

permissions:
  contents: read    # Download the repository source code
  packages: read    # Needed to load container images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: external/vcpkg
  VCPKG_DISABLE_METRICS: 1 # vcpkg is by default sending build metrics, we do not need it here

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  linux:
    name: ${{ matrix.config.name }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false # We would like to see the results of all jobs even in case one of them fails
      max-parallel: 4

      matrix:
        build_type: [Debug, Release]

        config:
          - name: rocky.9-x64
            os: ubuntu-24.04
            image: ghcr.io/vanillapdf/vanillapdf-rockylinux-amd64:9
            platform: linux/amd64
            preset: linux-x64-gcc

          - name: rocky.9-arm64
            os: ubuntu-24.04-arm
            image: ghcr.io/vanillapdf/vanillapdf-rockylinux-arm64v8:9
            platform: linux/arm64
            preset: linux-arm64-gcc

          - name: ubuntu.24.04-x64
            os: ubuntu-24.04
            image: ghcr.io/vanillapdf/vanillapdf-ubuntu-amd64:24.04
            platform: linux/amd64
            preset: linux-x64-gcc

          - name: ubuntu.24.04-arm64
            os: ubuntu-24.04-arm
            image: ghcr.io/vanillapdf/vanillapdf-ubuntu-arm64v8:24.04
            platform: linux/arm64
            preset: linux-arm64-gcc

    container:
      image: ${{ matrix.config.image }}
      options: --platform=${{ matrix.config.platform }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.config.preset }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ matrix.config.name }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json', 'cmake/overlays/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.name }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-${{ matrix.config.name }}-

      # Bootstrap vcpkg on Linux
      - name: Bootstrap vcpkg (Linux)
        run: ./external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Generate build files
        run: cmake --preset ${{ matrix.config.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DVANILLAPDF_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.config.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.config.preset }} --output-on-failure


  windows:
    name: ${{ matrix.config.name }} - ${{ matrix.build_type }}
    runs-on: windows-2025

    strategy:
      fail-fast: false # We would like to see the results of all jobs even in case one of them fails
      max-parallel: 4

      matrix:

        # There are some issues with win-x86 in debug, that prevent us to use it
        build_type: [Release]

        config:
          - name: win.2025-x86
            preset: windows-x86-msvc-17

          - name: win.2025-x64
            preset: windows-x64-msvc-17

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.config.preset }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ matrix.config.name }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json', 'cmake/overlays/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.name }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-${{ matrix.config.name }}-

      # Bootstrap vcpkg on Windows
      - name: Bootstrap vcpkg (Windows)
        run: ${{ github.workspace }}\\external\\vcpkg\\bootstrap-vcpkg.bat

      - name: Generate build files ${{ matrix.config.preset }}
        run: cmake --preset ${{ matrix.config.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DVANILLAPDF_ENABLE_TESTS=ON

      - name: Build ${{ matrix.config.preset }}
        run: cmake --build --preset ${{ matrix.config.preset }} --config ${{ matrix.build_type }}

      - name: Test ${{ matrix.config.preset }}
        run: ctest --preset ${{ matrix.config.preset }} -C ${{ matrix.build_type }} --output-on-failure

  macos:
    name: ${{ matrix.config.name }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.config.runner }}

    strategy:
      fail-fast: false # We would like to see the results of all jobs even in case one of them fails
      max-parallel: 4

      matrix:
        build_type: [Debug, Release]

        config:
          - name: osx.13-x64
            runner: macos-13
            preset: macos-x64

          - name: osx.15-arm64
            runner: macos-15
            preset: macos-arm64

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.config.preset }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ matrix.config.name }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json', 'cmake/overlays/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.name }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-${{ matrix.config.name }}-

      - name: Install build tools (macOS)
        run: brew install --quiet autoconf automake autoconf-archive

      # TODO: Remove this workaround - see GitHub issue #125
      # Technical debt: technical/debt/macos-jpeg-conflict.md
      # This fixes "Wrong JPEG library version: library is 62, caller expects 80" on macOS
      - name: Fix JPEG library conflicts (macOS) - TEMPORARY WORKAROUND
        run: |
          echo "=== Before JPEG fix ==="
          brew list --formula | grep jpeg || echo "No jpeg packages found"
          which jpeg 2>/dev/null || echo "No jpeg command found"
          ls -la /opt/homebrew/lib/libjpeg* 2>/dev/null || echo "No libjpeg* in /opt/homebrew/lib"
          ls -la /usr/local/lib/libjpeg* 2>/dev/null || echo "No libjpeg* in /usr/local/lib"

          echo "=== Unlinking conflicting JPEG packages ==="
          brew unlink jpeg 2>/dev/null || echo "jpeg not linked or not found"
          brew unlink jpeg-turbo 2>/dev/null || echo "jpeg-turbo not linked or not found"
          brew unlink libjpeg 2>/dev/null || echo "libjpeg not linked or not found"

          echo "=== After JPEG fix ==="
          brew list --formula | grep jpeg || echo "No jpeg packages found"
          ls -la /opt/homebrew/lib/libjpeg* 2>/dev/null || echo "No libjpeg* in /opt/homebrew/lib"
          ls -la /usr/local/lib/libjpeg* 2>/dev/null || echo "No libjpeg* in /usr/local/lib"

      # Bootstrap vcpkg on macOS
      - name: Bootstrap vcpkg (macOS)
        run: ${{ github.workspace }}/external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Generate build files
        run: cmake --preset ${{ matrix.config.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DVANILLAPDF_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.config.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.config.preset }} --output-on-failure
