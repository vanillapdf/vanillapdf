name: FetchContent Integration

on:
  workflow_dispatch:

  # Weekly test on Sundays at 2 AM UTC
  schedule:
    - cron: '0 2 * * 0'

  # Run on changes that could affect FetchContent
  push:
    branches: [ "main" ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'vcpkg.json'
      - 'examples/fetchcontent-integration/**'

  pull_request:
    branches: [ "main" ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'vcpkg.json'
      - 'examples/fetchcontent-integration/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: 1

jobs:
  setup:
    name: Setup Git Reference
    runs-on: ubuntu-latest
    outputs:
      git_tag: ${{ steps.git_ref.outputs.git_tag }}

    steps:
      - name: Configure Git reference for testing
        id: git_ref
        run: |
          echo "Testing FetchContent integration against: ${{ github.ref_name }}"
          # For PR/push events, test against the branch instead of specific commit
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_TO_TEST="${{ github.head_ref }}"
          else
            BRANCH_TO_TEST="${{ github.ref_name }}"
          fi
          echo "Using branch: $BRANCH_TO_TEST"
          echo "git_tag=$BRANCH_TO_TEST" >> $GITHUB_OUTPUT

  linux:
    name: Linux ${{ matrix.preset }} (External Deps)
    runs-on: ubuntu-latest
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        preset: [linux-x64-debug, linux-x64-release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Note: No submodules needed - FetchContent manages VanillaPDF source only

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev libjpeg-turbo8-dev zlib1g-dev libopenjp2-7-dev libopenjp2-tools

      - name: Configure CMake
        working-directory: examples/fetchcontent-integration
        run: |
          echo "Using Git tag: ${{ needs.setup.outputs.git_tag }}"
          cmake --preset ${{ matrix.preset }} \
            -DFETCHCONTENT_EXAMPLE_VANILLAPDF_GIT_TAG="${{ needs.setup.outputs.git_tag }}" \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_OPENSSL=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_JPEG=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_OPENJPEG=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_ZLIB=ON

      - name: Build
        working-directory: examples/fetchcontent-integration
        run: |
          cmake --build --preset ${{ matrix.preset }}

      - name: Run integration test
        working-directory: examples/fetchcontent-integration
        run: |
          echo "Running FetchContent integration test via CTest..."
          ctest --preset ${{ matrix.preset }} --output-on-failure

  windows:
    name: Windows ${{ matrix.preset }} (vcpkg)
    runs-on: windows-latest
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        preset: [windows-x64-debug, windows-x64-release]
        include:
          - preset: windows-x64-debug
            build_type: Debug
          - preset: windows-x64-release
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Note: No submodules needed - FetchContent manages VanillaPDF source only

      - name: Set up Visual Studio
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        working-directory: examples/fetchcontent-integration
        run: |
          echo "Using Git tag: ${{ needs.setup.outputs.git_tag }}"
          cmake --preset ${{ matrix.preset }} \
            -DFETCHCONTENT_EXAMPLE_VANILLAPDF_GIT_TAG="${{ needs.setup.outputs.git_tag }}"
        shell: bash

      - name: Build
        working-directory: examples/fetchcontent-integration
        run: |
          cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.build_type }}

      - name: Run integration test
        working-directory: examples/fetchcontent-integration
        run: |
          echo "Running FetchContent integration test via CTest..."
          ctest --preset ${{ matrix.preset }} -C ${{ matrix.build_type }} --output-on-failure

  macos:
    name: macOS ${{ matrix.preset }} (Homebrew)
    runs-on: macos-latest
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        preset: [macos-arm64-debug, macos-arm64-release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Note: No submodules needed - FetchContent manages VanillaPDF source only

      - name: Install system dependencies
        run: |
          # Install dependencies via Homebrew for faster builds
          brew install ninja openssl@3 jpeg-turbo zlib openjpeg

      - name: Configure CMake
        working-directory: examples/fetchcontent-integration
        run: |
          echo "Using Git tag: ${{ needs.setup.outputs.git_tag }}"
          cmake --preset ${{ matrix.preset }} \
            -DFETCHCONTENT_EXAMPLE_VANILLAPDF_GIT_TAG="${{ needs.setup.outputs.git_tag }}" \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_OPENSSL=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_JPEG=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_OPENJPEG=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_ZLIB=ON

      - name: Build
        working-directory: examples/fetchcontent-integration
        run: |
          cmake --build --preset ${{ matrix.preset }}

      - name: Run integration test
        working-directory: examples/fetchcontent-integration
        run: |
          echo "Running FetchContent integration test via CTest..."
          ctest --preset ${{ matrix.preset }} --output-on-failure

