name: FetchContent Integration

on:
  workflow_dispatch:

  # Weekly test on Sundays at 2 AM UTC
  schedule:
    - cron: '0 2 * * 0'

  # Run on changes that could affect FetchContent
  push:
    branches: [ "main" ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'vcpkg.json'
      - 'examples/fetchcontent-integration/**'

  pull_request:
    branches: [ "main" ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'vcpkg.json'
      - 'examples/fetchcontent-integration/**'

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: 1

jobs:
  fetchcontent-test:
    name: FetchContent Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libjpeg-turbo8-dev zlib1g-dev libopenjp2-7-dev

      - name: Test FetchContent Integration
        working-directory: examples/fetchcontent-integration
        run: |
          echo "Testing FetchContent integration against: ${{ github.ref_name }}"
          # For PR/push events, test against the branch instead of specific commit
          # This avoids issues with commits that don't exist in the remote yet
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_TO_TEST="${{ github.head_ref }}"
          else
            BRANCH_TO_TEST="${{ github.ref_name }}"
          fi
          echo "Using branch: $BRANCH_TO_TEST"
          cmake -S . -B build -DVANILLAPDF_GIT_TAG="$BRANCH_TO_TEST"
          cmake --build build