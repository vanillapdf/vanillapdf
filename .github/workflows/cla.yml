name: CLA Assistant

# Checks that every external contributor has signed the Contributor License
# Agreement (CLA.md) before their pull request can be merged. Signatures are
# recorded in the private vanillapdf/vanillapdf-cla repository.
#
# SECURITY: This workflow runs on pull_request_target and therefore has access
# to secrets. It must NEVER check out or execute code from the pull request.
#
# The signing phrase in the `if` condition below must match, character for
# character, the phrase quoted in CLA.md ("How to sign") and CONTRIBUTING.md.
# If you ever set custom-pr-sign-comment here, update those documents in the
# same change — a mismatch produces a check that can never turn green.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  cla-check:
    name: CLA check
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: CLA Assistant Lite
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          remote-organization-name: vanillapdf
          remote-repository-name: vanillapdf-cla
          branch: main
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/vanillapdf/vanillapdf/blob/main/CLA.md
          allowlist: jurzik,vanillapdf-bot,dependabot[bot]
