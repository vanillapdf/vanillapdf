name: Sanitizer checks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [ "main", "release/*" ]
    paths:
      - '.github/workflows/sanitizers.yml'
  pull_request:
    paths:
      - '.github/workflows/sanitizers.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: external/vcpkg
  VCPKG_DISABLE_METRICS: 1
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/external/vcpkg/bincache,readwrite"
  BUILD_PRESET: linux-x64-gcc
  RUNNER_IMAGE: ubuntu-24.04

jobs:
  vcpkg-setup:
    name: Install vcpkg dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libjpeg-turbo8 libjpeg-turbo8-dev zlib1g-dev libopenjp2-7-dev libopenjp2-tools

      - name: Cache vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            external/vcpkg/downloads
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-ubuntu-24.04-x64-gcc-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-ubuntu-24.04-x64-gcc-

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Configure (installs vcpkg dependencies)
        run: |
          cmake --preset ${{ env.BUILD_PRESET }} \
            -DVANILLAPDF_EXTERNAL_OPENSSL=ON \
            -DVANILLAPDF_EXTERNAL_JPEG=ON \
            -DVANILLAPDF_EXTERNAL_ZLIB=ON \
            -DVANILLAPDF_ENABLE_TESTS=ON

  sanitizer:
    name: ${{ matrix.name }}
    needs: vcpkg-setup
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan
            os: ubuntu-24.04
            cmake_flag: VANILLAPDF_ENABLE_ASAN
          - name: UBSan
            os: ubuntu-24.04
            cmake_flag: VANILLAPDF_ENABLE_UBSAN
          - name: TSan
            os: ubuntu-24.04
            cmake_flag: VANILLAPDF_ENABLE_TSAN

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libjpeg-turbo8 libjpeg-turbo8-dev zlib1g-dev libopenjp2-7-dev libopenjp2-tools

      - name: Restore vcpkg cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            external/vcpkg/downloads
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-ubuntu-24.04-x64-gcc-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-ubuntu-24.04-x64-gcc-

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Configure
        run: |
          cmake --preset ${{ env.BUILD_PRESET }} -DCMAKE_BUILD_TYPE=Debug \
            -D${{ matrix.cmake_flag }}=ON \
            -DVANILLAPDF_EXTERNAL_OPENSSL=ON \
            -DVANILLAPDF_EXTERNAL_JPEG=ON \
            -DVANILLAPDF_EXTERNAL_ZLIB=ON \
            -DVANILLAPDF_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build --preset ${{ env.BUILD_PRESET }}

      - name: Test
        run: ctest --preset ${{ env.BUILD_PRESET }} --output-on-failure
