name: Sanitizer checks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [ "main", "release/*" ]
    paths:
      - '.github/workflows/sanitizers.yml'
  pull_request:
    paths:
      - '.github/workflows/sanitizers.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: external/vcpkg
  VCPKG_DISABLE_METRICS: 1
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/external/vcpkg/bincache,readwrite"
  BUILD_PRESET: linux-x64-gcc
  RUNNER_IMAGE: ubuntu-24.04

jobs:
  vcpkg-setup:
    name: Install vcpkg dependencies
    runs-on: ${{ env.RUNNER_IMAGE }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libjpeg-turbo8 libjpeg-turbo8-dev zlib1g-dev libopenjp2-7-dev libopenjp2-tools

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            build/${{ env.BUILD_PRESET }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-${{ env.BUILD_PRESET }}-sanitizers-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-${{ env.BUILD_PRESET }}-sanitizers-
            vcpkg-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Configure (installs vcpkg dependencies)
        run: |
          cmake --preset ${{ env.BUILD_PRESET }} \
            -DVANILLAPDF_EXTERNAL_OPENSSL=ON \
            -DVANILLAPDF_EXTERNAL_JPEG=ON \
            -DVANILLAPDF_EXTERNAL_ZLIB=ON \
            -DVANILLAPDF_ENABLE_TESTS=ON

  asan:
    name: ASan
    needs: vcpkg-setup
    runs-on: ${{ env.RUNNER_IMAGE }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libjpeg-turbo8 libjpeg-turbo8-dev zlib1g-dev libopenjp2-7-dev libopenjp2-tools

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v5
        with:
          path: |
            build/${{ env.BUILD_PRESET }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-${{ env.BUILD_PRESET }}-sanitizers-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-${{ env.BUILD_PRESET }}-sanitizers-
            vcpkg-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Configure
        run: |
          cmake --preset ${{ env.BUILD_PRESET }} -DCMAKE_BUILD_TYPE=Debug \
            -DVANILLAPDF_ENABLE_ASAN=ON \
            -DVANILLAPDF_EXTERNAL_OPENSSL=ON \
            -DVANILLAPDF_EXTERNAL_JPEG=ON \
            -DVANILLAPDF_EXTERNAL_ZLIB=ON \
            -DVANILLAPDF_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build --preset ${{ env.BUILD_PRESET }}

      - name: Test
        run: ctest --preset ${{ env.BUILD_PRESET }} --output-on-failure

  ubsan:
    name: UBSan
    needs: vcpkg-setup
    runs-on: ${{ env.RUNNER_IMAGE }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libjpeg-turbo8 libjpeg-turbo8-dev zlib1g-dev libopenjp2-7-dev libopenjp2-tools

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v5
        with:
          path: |
            build/${{ env.BUILD_PRESET }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-${{ env.BUILD_PRESET }}-sanitizers-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-${{ env.BUILD_PRESET }}-sanitizers-
            vcpkg-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Configure
        run: |
          cmake --preset ${{ env.BUILD_PRESET }} -DCMAKE_BUILD_TYPE=Debug \
            -DVANILLAPDF_ENABLE_UBSAN=ON \
            -DVANILLAPDF_EXTERNAL_OPENSSL=ON \
            -DVANILLAPDF_EXTERNAL_JPEG=ON \
            -DVANILLAPDF_EXTERNAL_ZLIB=ON \
            -DVANILLAPDF_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build --preset ${{ env.BUILD_PRESET }}

      - name: Test
        run: ctest --preset ${{ env.BUILD_PRESET }} --output-on-failure

  tsan:
    name: TSan
    needs: vcpkg-setup
    runs-on: ${{ env.RUNNER_IMAGE }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libjpeg-turbo8 libjpeg-turbo8-dev zlib1g-dev libopenjp2-7-dev libopenjp2-tools

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v5
        with:
          path: |
            build/${{ env.BUILD_PRESET }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-${{ env.BUILD_PRESET }}-sanitizers-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-${{ env.BUILD_PRESET }}-sanitizers-
            vcpkg-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Configure
        run: |
          cmake --preset ${{ env.BUILD_PRESET }} -DCMAKE_BUILD_TYPE=Debug \
            -DVANILLAPDF_ENABLE_TSAN=ON \
            -DVANILLAPDF_EXTERNAL_OPENSSL=ON \
            -DVANILLAPDF_EXTERNAL_JPEG=ON \
            -DVANILLAPDF_EXTERNAL_ZLIB=ON \
            -DVANILLAPDF_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build --preset ${{ env.BUILD_PRESET }}

      - name: Test
        run: ctest --preset ${{ env.BUILD_PRESET }} --output-on-failure
