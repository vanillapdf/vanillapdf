name: Create Conan Center PR

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v2.3.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run - prepare changes but don't commit or create PR"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare-conan-changes:
    name: Prepare Conan Center update
    runs-on: ubuntu-latest
    outputs:
      branch-name: vanillapdf-${{ steps.version.outputs.version }}
      pr-url: ${{ steps.pr-info.outputs.pr-url }}
      is_latest: ${{ steps.check_latest.outputs.is_latest }}
    steps:
      - name: Parse version from tag
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Checkout vanillapdf repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: vanillapdf
          # Dry-run: use current commit (has latest scripts/recipes); real run: use the tag
          ref: ${{ inputs.dry_run && github.sha || inputs.tag }}
          fetch-depth: 0

      - name: Check if latest version
        id: check_latest
        run: |
          cd vanillapdf
          LATEST=$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          LATEST="${LATEST#v}"
          VERSION="${{ steps.version.outputs.version }}"
          echo "Current version: ${VERSION}"
          echo "Latest version: ${LATEST}"
          if [ "$VERSION" != "$LATEST" ]; then
            echo "Not the latest version, skipping Conan Center PR"
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Git & GitHub CLI
        if: ${{ steps.check_latest.outputs.is_latest == 'true' }}
        run: |
          git config --global user.name "vanillapdf-bot"
          git config --global user.email "info@vanillapdf.com"

      - name: Clone conan-center-index fork
        if: ${{ steps.check_latest.outputs.is_latest == 'true' }}
        run: |
          git clone https://github.com/vanillapdf/conan-center-index.git
          cd conan-center-index
          git remote add upstream https://github.com/conan-io/conan-center-index.git
          git fetch upstream
          git checkout -b vanillapdf-${{ steps.version.outputs.version }} upstream/master

      - name: Calculate SHA256 for source archive
        if: ${{ steps.check_latest.outputs.is_latest == 'true' }}
        id: sha256
        run: |
          VERSION="${{ inputs.tag }}"
          ARCHIVE_URL="https://github.com/vanillapdf/vanillapdf/archive/refs/tags/${VERSION}.tar.gz"

          echo "Downloading archive from: ${ARCHIVE_URL}"
          curl -sL "${ARCHIVE_URL}" -o source.tar.gz

          SHA256=$(sha256sum source.tar.gz | cut -d' ' -f1)
          echo "SHA256: ${SHA256}"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

          rm source.tar.gz

      - name: Create CCI recipe files
        if: ${{ steps.check_latest.outputs.is_latest == 'true' }}
        run: |
          python3 vanillapdf/scripts/prepare_cci_recipe.py \
            --version "${{ steps.version.outputs.version }}" \
            --sha256 "${{ steps.sha256.outputs.sha256 }}" \
            --source-dir vanillapdf \
            --cci-dir conan-center-index

      - name: Show prepared changes (dry run)
        if: ${{ inputs.dry_run && steps.check_latest.outputs.is_latest == 'true' }}
        run: |
          cd conan-center-index
          echo "=== Dry run mode - showing prepared changes ==="
          echo ""
          echo "=== Recipe files ==="
          echo "--- config.yml ---"
          cat recipes/vanillapdf/config.yml
          echo ""
          echo "--- conanfile.py ---"
          cat recipes/vanillapdf/all/conanfile.py
          echo ""
          echo "--- conandata.yml ---"
          cat recipes/vanillapdf/all/conandata.yml
          echo ""
          echo "--- test_package/conanfile.py ---"
          cat recipes/vanillapdf/all/test_package/conanfile.py
          echo ""
          echo "=== Git status ==="
          git status
          echo ""
          echo "=== Dry run complete - no changes committed ==="

      - name: Set authenticated origin for push
        if: ${{ !inputs.dry_run && steps.check_latest.outputs.is_latest == 'true' }}
        run: |
          cd conan-center-index
          git remote set-url origin "https://x-access-token:${BOT_TOKEN}@github.com/vanillapdf/conan-center-index.git"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Commit and push changes to fork
        if: ${{ !inputs.dry_run && steps.check_latest.outputs.is_latest == 'true' }}
        run: |
          cd conan-center-index
          git add recipes/vanillapdf/
          git commit -m "Add vanillapdf/${{ steps.version.outputs.version }}"
          git push origin vanillapdf-${{ steps.version.outputs.version }}

      - name: Generate PR info
        if: ${{ steps.check_latest.outputs.is_latest == 'true' }}
        id: pr-info
        run: |
          echo "pr-url=https://github.com/vanillapdf/conan-center-index/compare/master...vanillapdf-${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "Changes prepared and pushed to vanillapdf/conan-center-index"
          echo "Review the changes at: https://github.com/vanillapdf/conan-center-index/compare/master...vanillapdf-${{ steps.version.outputs.version }}"

  create-official-pr:
    name: Create PR to Conan Center Index
    runs-on: ubuntu-latest
    needs: prepare-conan-changes
    if: ${{ !inputs.dry_run && needs.prepare-conan-changes.outputs.is_latest == 'true' }}
    environment: production
    steps:
      - name: Setup Git & GitHub CLI
        run: |
          git config --global user.name "vanillapdf-bot"
          git config --global user.email "info@vanillapdf.com"

      - name: Clone conan-center-index fork
        run: |
          gh repo clone vanillapdf/conan-center-index
          cd conan-center-index
          git fetch origin
          git checkout ${{ needs.prepare-conan-changes.outputs.branch-name }}
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Create draft pull request to official repo
        run: |
          cd conan-center-index
          VERSION="${{ inputs.tag }}"
          VERSION_NO_V="${VERSION#v}"

          BODY="## New Recipe: vanillapdf/${VERSION_NO_V}

          **Description:**
          Cross-platform toolkit for creating and modifying PDF documents.

          **Homepage:** https://vanillapdf.com
          **License:** Apache-2.0
          **Source:** https://github.com/vanillapdf/vanillapdf

          **Checklist:**
          - [x] Recipe builds and tests pass locally
          - [x] License file is included in package
          - [x] \`test_package\` validates basic functionality
          - [x] Source comes from authoritative GitHub repository

          ---

          Changes prepared by vanillapdf release automation.
          Review branch: ${{ needs.prepare-conan-changes.outputs.pr-url }}"

          gh pr create \
            --repo conan-io/conan-center-index \
            --title "Add vanillapdf/${VERSION_NO_V}" \
            --body "$BODY" \
            --base master \
            --head vanillapdf:${{ needs.prepare-conan-changes.outputs.branch-name }} \
            --draft
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
