name: Release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/build-nuget.yml'
      - '.github/workflows/build-deb-package.yml'
      - '.github/workflows/build-rpm-package.yml'
      - '.github/workflows/build-brew-package.yml'
      - '.github/workflows/github-release.yml'
      - '.github/workflows/github-pages.yml'
      - '.github/workflows/create-vcpkg-pr.yml'
      - '.github/workflows/create-conan-pr.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to create (e.g. v2.3.0-alpha.2)"
        required: true
        type: string
      dry_run:
        description: "Dry run - validate workflow without publishing or tagging"
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      latest_tag: ${{ steps.parse.outputs.latest_tag }}
      is_latest: ${{ steps.parse.outputs.is_latest }}
      build_suffix: ${{ steps.parse.outputs.build_suffix }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      dry_run: ${{ steps.parse.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Extract tag name and suffix
        id: parse
        run: |
          # Determine tag based on event type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Derive synthetic tag from cmake/version.cmake
            MAJOR=$(grep 'VANILLAPDF_VERSION_MAJOR' cmake/version.cmake | grep -o '[0-9]\+')
            MINOR=$(grep 'VANILLAPDF_VERSION_MINOR' cmake/version.cmake | grep -o '[0-9]\+')
            PATCH=$(grep 'VANILLAPDF_VERSION_PATCH' cmake/version.cmake | grep -o '[0-9]\+')
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          VERSION="${TAG#v}"
          EXTRA=""
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(.*)$ ]]; then
            EXTRA="${BASH_REMATCH[1]}"
          fi
          if [[ -n "$EXTRA" ]]; then
            echo "build_suffix=${EXTRA#-}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_suffix=" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # pull_request is always dry_run; workflow_dispatch uses the input value
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi

          # Find the latest real tag for dry-run validation workflows
          # (synthetic tags from version.cmake don't exist as git refs)
          LATEST_TAG=$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -n "$LATEST_TAG" ]; then
            echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "Latest real tag: $LATEST_TAG"
          else
            echo "latest_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "No real tags found, using synthetic tag: $TAG"
          fi

          # Decide whether this release is the newest stable version. The
          # latest_tag above only sees tags that already exist, but the tag
          # being released is created later when the draft is published, so it
          # is never in that list. Compare the existing stable tags *plus* this
          # tag to drive the "latest" GitHub release flag and the latest-only
          # jobs (docs deploy, vcpkg/Homebrew/Conan PRs, port update).
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            HIGHEST=$( { git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'; echo "$TAG"; } | sort -V | tail -1)
            if [ "$HIGHEST" = "$TAG" ]; then
              echo "is_latest=true" >> "$GITHUB_OUTPUT"
              echo "This is the newest stable release"
            else
              echo "is_latest=false" >> "$GITHUB_OUTPUT"
              echo "Not the newest stable release (highest is $HIGHEST)"
            fi
          else
            # Pre-release tags (alpha/beta/rc) are never the latest stable release
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Pre-release tag, not marked latest"
          fi

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    needs: prepare
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - name: Verify repository versions match tag
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3 | cut -d- -f1)
          # cmake/version.cmake is the source of truth - vcpkg.json is generated from it
          grep -q "set(VANILLAPDF_VERSION_MAJOR ${MAJOR})" cmake/version.cmake || { echo "Version major mismatch"; exit 1; }
          grep -q "set(VANILLAPDF_VERSION_MINOR ${MINOR})" cmake/version.cmake || { echo "Version minor mismatch"; exit 1; }
          grep -q "set(VANILLAPDF_VERSION_PATCH ${PATCH})" cmake/version.cmake || { echo "Version patch mismatch"; exit 1; }
          # Note: ports/vanillapdf/vcpkg.json is updated after the release via scripts/update_port.py
          # (requires SHA512 of the release tarball which is only available after tag push)


  build-nuget:
    needs: [verify, prepare]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-nuget.yml
    with:
      build_suffix: ${{ needs.prepare.outputs.build_suffix }}
    secrets: inherit

  build-deb:
    needs: [verify, prepare]
    permissions:
      contents: read
    uses: ./.github/workflows/build-deb-package.yml
    with:
      build_suffix: ${{ needs.prepare.outputs.build_suffix }}
    secrets: inherit

  build-rpm:
    needs: [verify, prepare]
    permissions:
      contents: read
    uses: ./.github/workflows/build-rpm-package.yml
    with:
      build_suffix: ${{ needs.prepare.outputs.build_suffix }}
    secrets: inherit

  build-dmg:
    needs: [verify, prepare]
    permissions:
      contents: read
    uses: ./.github/workflows/build-brew-package.yml
    with:
      build_suffix: ${{ needs.prepare.outputs.build_suffix }}
    secrets: inherit

  nuget-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      packages: write
    environment: staging
    needs: [build-nuget, prepare]
    if: needs.prepare.outputs.dry_run == 'false'
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: ./nupkgs
      - name: Push to GitHub Packages
        run: |
          dotnet nuget push nupkgs/**/*.nupkg \
            --source "${{ vars.NUGET_SOURCE }}" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

  dry-run-pages:
    needs: [build-nuget, prepare]
    if: needs.prepare.outputs.dry_run == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/github-pages.yml
    with:
      deploy: false
    secrets: inherit

  dry-run-vcpkg:
    needs: [build-nuget, prepare]
    if: needs.prepare.outputs.prerelease == 'false' && needs.prepare.outputs.dry_run == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/create-vcpkg-pr.yml
    with:
      tag: ${{ needs.prepare.outputs.latest_tag }}
      dry_run: true
    secrets: inherit

  dry-run-conan:
    needs: [build-nuget, prepare]
    if: needs.prepare.outputs.prerelease == 'false' && needs.prepare.outputs.dry_run == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/create-conan-pr.yml
    with:
      tag: ${{ needs.prepare.outputs.latest_tag }}
      dry_run: true
    secrets: inherit

  dry-run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {}
    needs: [build-nuget, build-deb, build-rpm, build-dmg, dry-run-pages, dry-run-vcpkg, dry-run-conan, prepare]
    if: always() && needs.prepare.outputs.dry_run == 'true'
    steps:
      - name: Dry run summary
        run: |
          echo "=== Dry Run Summary ==="
          echo "Tag: ${{ needs.prepare.outputs.tag }}"
          echo "Validation tag: ${{ needs.prepare.outputs.latest_tag }}"
          echo "Build suffix: ${{ needs.prepare.outputs.build_suffix }}"
          echo "Prerelease: ${{ needs.prepare.outputs.prerelease }}"
          echo ""
          echo "NuGet build: ${{ needs.build-nuget.result }}"
          echo "DEB build: ${{ needs.build-deb.result }}"
          echo "RPM build: ${{ needs.build-rpm.result }}"
          echo "DMG build: ${{ needs.build-dmg.result }}"
          echo "GitHub Pages build: ${{ needs.dry-run-pages.result }}"
          if [ "${{ needs.prepare.outputs.prerelease }}" = "false" ]; then
            echo "vcpkg PR (dry run): ${{ needs.dry-run-vcpkg.result }}"
            echo "Conan PR (dry run): ${{ needs.dry-run-conan.result }}"
          else
            echo "vcpkg PR: skipped (prerelease)"
            echo "Conan PR: skipped (prerelease)"
          fi
          echo ""
          FAILED=false
          if [ "${{ needs.build-nuget.result }}" != "success" ]; then FAILED=true; fi
          if [ "${{ needs.build-deb.result }}" != "success" ]; then FAILED=true; fi
          if [ "${{ needs.build-rpm.result }}" != "success" ]; then FAILED=true; fi
          if [ "${{ needs.build-dmg.result }}" != "success" ]; then FAILED=true; fi
          if [ "${{ needs.dry-run-pages.result }}" != "success" ]; then FAILED=true; fi
          if [ "${{ needs.prepare.outputs.prerelease }}" = "false" ]; then
            if [ "${{ needs.dry-run-vcpkg.result }}" != "success" ]; then FAILED=true; fi
            if [ "${{ needs.dry-run-conan.result }}" != "success" ]; then FAILED=true; fi
          fi
          if [ "$FAILED" = "true" ]; then
            echo "::error::One or more dry-run validations failed"
            exit 1
          fi
          echo "=== All dry-run validations passed ==="

  # Create the GitHub release as a *draft* before the production gate. The tag is
  # deliberately not created here - publishing the draft (publish-release, after
  # the gate) is what creates it. This lets a human edit the release body during
  # the gate pause and avoids the untagged-* binding bug that a pre-existing tag
  # causes when a draft is published.
  create-draft-release:
    needs: [nuget-staging, build-deb, build-rpm, build-dmg, prepare]
    if: needs.prepare.outputs.dry_run == 'false'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/github-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      prerelease: ${{ fromJSON(needs.prepare.outputs.prerelease) }}
      latest: ${{ fromJSON(needs.prepare.outputs.is_latest) }}
      target: ${{ github.sha }}
    secrets: inherit

  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {}
    needs: [create-draft-release, prepare]
    environment: production
    outputs:
      tag: ${{ needs.prepare.outputs.tag }}
      latest_tag: ${{ needs.prepare.outputs.latest_tag }}
      is_latest: ${{ needs.prepare.outputs.is_latest }}
      prerelease: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - run: echo "Draft release created. Edit the release body in the UI, then approve to publish."

  # Flip the reviewed draft to a published release. Publishing creates the tag at
  # the draft's target commit and binds the release to it. BOT_TOKEN is used so
  # the tag can be created under any tag protection rulesets.
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    needs: production-gate
    outputs:
      tag: ${{ needs.production-gate.outputs.tag }}
      latest_tag: ${{ needs.production-gate.outputs.latest_tag }}
      is_latest: ${{ needs.production-gate.outputs.is_latest }}
      prerelease: ${{ needs.production-gate.outputs.prerelease }}
    steps:
      - name: Publish draft release
        env:
          TAG: ${{ needs.production-gate.outputs.tag }}
          IS_LATEST: ${{ needs.production-gate.outputs.is_latest }}
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          LATEST_FLAG=""
          if [ "$IS_LATEST" = "false" ]; then
            LATEST_FLAG="--latest=false"
          fi
          gh release edit "$TAG" --draft=false $LATEST_FLAG

  publish-nuget:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write  # Enable GitHub OIDC token issuance for NuGet trusted publishing
    needs: publish-release
    environment: production
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: ./nupkgs
      # Exchange the OIDC token for a short-lived nuget.org API key (valid 1 hour).
      # Requires a Trusted Publishing policy on nuget.org bound to this repo,
      # workflow file (release.yml) and the production environment.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to NuGet.org
        run: |
          dotnet nuget push nupkgs/**/*.nupkg \
            --source "${{ vars.NUGET_SOURCE }}" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

  github-pages:
    needs: publish-release
    # Only deploy documentation for the newest stable release (not pre-releases
    # or patches on older release lines, which would clobber current docs)
    if: needs.publish-release.outputs.prerelease == 'false' && needs.publish-release.outputs.is_latest == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/github-pages.yml
    with:
      deploy: true
    secrets: inherit

  vcpkg-pr:
    needs: publish-release
    # Only create vcpkg PR for the newest stable release, so the published port
    # is never downgraded by a pre-release or an older release-line patch
    if: needs.publish-release.outputs.prerelease == 'false' && needs.publish-release.outputs.is_latest == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/create-vcpkg-pr.yml
    with:
      tag: ${{ needs.publish-release.outputs.tag }}
    secrets: inherit

  homebrew-pr:
    needs: publish-release
    # Only create Homebrew PR for official releases, not pre-releases (alpha, beta, rc).
    # The newest-version check is enforced inside update-homebrew.yml, which runs
    # after the tag is pushed (so its tag list is accurate).
    if: needs.publish-release.outputs.prerelease == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: ${{ needs.publish-release.outputs.tag }}
    secrets: inherit

  conan-pr:
    needs: publish-release
    # Only create Conan Center PR for official releases, not pre-releases (alpha, beta, rc).
    # Conan Center holds parallel versions, so this is not gated on is_latest; the
    # latest-version policy is enforced inside create-conan-pr.yml (post-tag).
    if: needs.publish-release.outputs.prerelease == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/create-conan-pr.yml
    with:
      tag: ${{ needs.publish-release.outputs.tag }}
    secrets: inherit

  attest:
    name: Attest Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      attestations: write
    needs: [publish-nuget, publish-release]
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: ./nupkgs
          merge-multiple: true

      - name: Download DEB package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vanillapdf-deb
          path: ./packages/deb

      - name: Download RPM package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vanillapdf-rpm
          path: ./packages/rpm

      - name: Download DMG package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vanillapdf-dmg
          path: ./packages/dmg

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: |
            ./nupkgs/**/*.nupkg
            ./packages/deb/*.deb
            ./packages/rpm/*.rpm
            ./packages/dmg/*.dmg

  verify-attest:
    name: Verify Artifact Attestations
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    needs: attest
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: ./nupkgs
          merge-multiple: true

      - name: Download DEB package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vanillapdf-deb
          path: ./packages/deb

      - name: Download RPM package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vanillapdf-rpm
          path: ./packages/rpm

      - name: Download DMG package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vanillapdf-dmg
          path: ./packages/dmg

      - name: Verify attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find ./nupkgs -name "*.nupkg" | while read -r pkg; do
            echo "Verifying: $pkg"
            gh attestation verify "$pkg" --repo "${{ github.repository }}"
          done
          find ./packages -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" | while read -r pkg; do
            echo "Verifying: $pkg"
            gh attestation verify "$pkg" --repo "${{ github.repository }}"
          done

  update-port:
    name: Update Local Port
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    needs: publish-release
    # Update the overlay port for every official release: the job always opens a
    # PR against its own release/X.Y branch and only updates main when this is the
    # newest version (that check lives inside the job, post-tag).
    if: needs.publish-release.outputs.prerelease == 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "vanillapdf-bot"
          git config --global user.email "info@vanillapdf.com"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.x'

      - name: Run update_port.py
        run: python scripts/update_port.py

      - name: Create Pull Request for Release Branch
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          VERSION="${{ needs.publish-release.outputs.tag }}"
          VERSION="${VERSION#v}"
          BRANCH="release/port-${VERSION}"

          # Determine base branch from version (e.g., 2.2.1 -> release/2.2)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          BASE_BRANCH="release/${MAJOR}.${MINOR}"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "chore: Update vcpkg port to version ${VERSION}" \
            --body "## Summary
          Update the local vcpkg overlay port to version ${VERSION}.

          - Updated \`ports/vanillapdf/vcpkg.json\` version
          - Updated \`ports/vanillapdf/portfile.cmake\` SHA512 hash

          This PR was automatically created by the release workflow.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)"

      - name: Check if Latest Version and Update Main
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          VERSION="${{ needs.publish-release.outputs.tag }}"
          VERSION="${VERSION#v}"

          # Get all release tags and find the latest version
          LATEST=$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          LATEST="${LATEST#v}"

          echo "Current version: ${VERSION}"
          echo "Latest version: ${LATEST}"

          if [ "$VERSION" != "$LATEST" ]; then
            echo "Not the latest version, skipping main branch update"
            exit 0
          fi

          echo "This is the latest version, creating PR to main"

          # Create a new branch for the main PR
          BRANCH_MAIN="release/port-${VERSION}-main"
          git checkout -b "$BRANCH_MAIN"
          git push -u origin "$BRANCH_MAIN"

          gh pr create \
            --base main \
            --head "$BRANCH_MAIN" \
            --title "chore: Update vcpkg port to version ${VERSION}" \
            --body "## Summary
          Update the local vcpkg overlay port to version ${VERSION}.

          - Updated \`ports/vanillapdf/vcpkg.json\` version
          - Updated \`ports/vanillapdf/portfile.cmake\` SHA512 hash

          This PR was automatically created by the release workflow.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)"
