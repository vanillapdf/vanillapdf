name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      build_suffix: ${{ steps.parse.outputs.build_suffix }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Extract tag name and suffix
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          EXTRA=""
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(.*)$ ]]; then
            EXTRA="${BASH_REMATCH[1]}"
          fi
          if [[ -n "$EXTRA" ]]; then
            echo "build_suffix=-${EXTRA#-}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_suffix=" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify repository versions match tag
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3 | cut -d- -f1)
          grep -q "\"version\": \"$VERSION\"" vcpkg.json || { echo "vcpkg.json version mismatch"; exit 1; }
          grep -q "\"version\": \"$VERSION\"" ports/vanillapdf/vcpkg.json || { echo "port manifest version mismatch"; exit 1; }
          grep -q "set(VANILLAPDF_VERSION_MAJOR ${MAJOR})" cmake/version.cmake || { echo "Version major mismatch"; exit 1; }
          grep -q "set(VANILLAPDF_VERSION_MINOR ${MINOR})" cmake/version.cmake || { echo "Version minor mismatch"; exit 1; }
          grep -q "set(VANILLAPDF_VERSION_PATCH ${PATCH})" cmake/version.cmake || { echo "Version patch mismatch"; exit 1; }


  build-nuget:
    needs: verify
    uses: ./.github/workflows/build-nuget.yml
    with:
      build_suffix: ${{ needs.prepare.outputs.build_suffix }}
    secrets: inherit

  nuget-staging:
    runs-on: ubuntu-latest
    environment: staging
    needs: build-nuget
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          path: ./nupkgs
      - name: Push to GitHub Packages
        run: |
          dotnet nuget push nupkgs/**/*.nupkg \
            --source "${{ vars.NUGET_SOURCE }}" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

  production-gate:
    runs-on: ubuntu-latest
    needs: nuget-staging
    environment: production
    steps:
      - run: echo "Awaiting production approval"

  publish-nuget:
    runs-on: ubuntu-latest
    needs: production-gate
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          path: ./nupkgs
      - name: Push to NuGet.org
        run: |
          dotnet nuget push nupkgs/**/*.nupkg \
            --source "${{ vars.NUGET_SOURCE }}" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --skip-duplicate

  github-pages:
    needs: production-gate
    uses: ./.github/workflows/github-pages.yml
    with:
      deploy: true
    secrets: inherit
  github-release:
    needs: production-gate
    uses: ./.github/workflows/github-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      prerelease: ${{ needs.prepare.outputs.prerelease }}
    secrets: inherit
