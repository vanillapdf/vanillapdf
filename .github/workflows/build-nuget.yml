name: Build NuGet Packages

on:
  workflow_call:
    inputs:
      build_suffix:
        required: false
        type: string
        default: ""
      patch_override:
        required: false
        type: string
        default: ""
      build_override:
        required: false
        type: string
        default: ""

  # Allow triggering manually from the Actions tab
  workflow_dispatch:
    inputs:
      build_suffix:
        description: "Optional build suffix for version (e.g., -nightly.main)"
        required: false
        default: ""
      patch_override:
        description: "Optional patch version override (e.g., 999 for nightly builds)"
        required: false
        default: ""
      build_override:
        description: "Optional build version override (e.g., 20251228 for nightly builds)"
        required: false
        default: ""

  # Run package build on code changes
  push:
    branches: [ "main", "release/*" ]
    paths:
      - '.github/workflows/build-nuget.yml'
      - 'nuget/**'
      - 'cmake/**'
      - 'vcpkg.json.in'

  pull_request:
    branches: [ "main", "release/*" ]
    paths:
      - '.github/workflows/build-nuget.yml'
      - 'nuget/**'
      - 'cmake/**'
      - 'vcpkg.json.in'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  # Needed for future GitHub release or content access
  packages: read  # Needed for publishing NuGet packages within organization

env:
  VCPKG_DISABLE_METRICS: 1
  VCPKG_ROOT: external/vcpkg # vcpkg is by default sending build metrics, we do not need it here
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/external/vcpkg/bincache,readwrite"

jobs:

  build-linux:
    name: ${{ matrix.config.rid }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - rid: linux-x64
            os: ubuntu-24.04
            image: ghcr.io/vanillapdf/vanillapdf-rockylinux-amd64:9
            platform: linux/amd64
            preset: linux-x64-gcc
            build_type: Release

          - rid: linux-arm64
            os: ubuntu-24.04-arm
            image: ghcr.io/vanillapdf/vanillapdf-rockylinux-arm64v8:9
            platform: linux/arm64
            preset: linux-arm64-gcc
            build_type: Release

    container:
      image: ${{ matrix.config.image }}
      options: --platform=${{ matrix.config.platform }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install ICU dependencies
        if: runner.os == 'Linux'
        run: dnf -y install libicu

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            build/${{ matrix.config.preset }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.config.rid }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.rid }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-${{ matrix.config.rid }}-

      # Bootstrap vcpkg on Linux
      - name: Bootstrap vcpkg (Linux)
        run: ./external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Configure ${{ matrix.config.rid }}
        run: |
          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}"
          CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_BUILD_SUFFIX=${{ inputs.build_suffix }}"
          if [ -n "${{ inputs.patch_override }}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_PATCH_OVERRIDE=${{ inputs.patch_override }}"
          fi
          if [ -n "${{ inputs.build_override }}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_BUILD_OVERRIDE=${{ inputs.build_override }}"
          fi
          CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_ENABLE_TESTS=ON"
          CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_ENABLE_PACKAGING=ON"
          cmake --preset ${{ matrix.config.preset }} $CMAKE_ARGS

      - name: Build ${{ matrix.config.rid }}
        run: cmake --build --preset ${{ matrix.config.preset }}

      - name: Test ${{ matrix.config.rid }}
        run: ctest --preset ${{ matrix.config.preset }}

      - name: Build package ${{ matrix.config.rid }}
        run: cmake --build build/${{ matrix.config.preset }} --target package

      - name: Restore NuGet packages
        run: dotnet restore nuget/vanillapdf.runtime.csproj

      - name: Execute nuget packaging
        run: dotnet pack nuget/vanillapdf.runtime.csproj --no-build --output .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: vanillapdf.runtime.${{ matrix.config.rid }}${{ inputs.build_suffix }}
          path: '*.nupkg'


  build-linux-musl:
    name: ${{ matrix.config.rid }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - rid: linux-musl-x64
            os: ubuntu-24.04
            preset: linux-musl-x64
            build_type: Release

          - rid: linux-musl-arm64
            os: ubuntu-24.04-arm
            preset: linux-musl-arm64
            build_type: Release

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            build/${{ matrix.config.preset }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.config.rid }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.rid }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-${{ matrix.config.rid }}-

      - name: Bootstrap vcpkg (Linux)
        run: ./external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Configure ${{ matrix.config.rid }}
        run: |
          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}"
          CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_BUILD_SUFFIX=${{ inputs.build_suffix }}"
          if [ -n "${{ inputs.patch_override }}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_PATCH_OVERRIDE=${{ inputs.patch_override }}"
          fi
          if [ -n "${{ inputs.build_override }}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_BUILD_OVERRIDE=${{ inputs.build_override }}"
          fi
          CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_ENABLE_TESTS=OFF"
          CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_ENABLE_PACKAGING=ON"
          cmake --preset ${{ matrix.config.preset }} $CMAKE_ARGS

      - name: Build ${{ matrix.config.rid }}
        run: cmake --build --preset ${{ matrix.config.preset }}

      - name: Build package ${{ matrix.config.rid }}
        run: cmake --build build/${{ matrix.config.preset }} --target package

      - name: Restore NuGet packages
        run: dotnet restore nuget/vanillapdf.runtime.csproj

      - name: Execute nuget packaging
        run: dotnet pack nuget/vanillapdf.runtime.csproj --no-build --output .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: vanillapdf.runtime.${{ matrix.config.rid }}${{ inputs.build_suffix }}
          path: '*.nupkg'


  build-windows:
    name: ${{ matrix.config.rid }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - rid: win-x86
            os: windows-latest
            preset: windows-x86-msvc-17-static
            build_type: Release

          - rid: win-x64
            os: windows-latest
            preset: windows-x64-msvc-17-static
            build_type: Release

          - rid: win-arm64
            os: windows-11-arm
            preset: windows-arm64-msvc-17-static
            build_type: Release

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            build/${{ matrix.config.preset }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.config.rid }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.rid }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-${{ matrix.config.rid }}-

      # Bootstrap vcpkg on Windows
      - name: Bootstrap vcpkg (Windows)
        run: ${{ github.workspace }}\\external\\vcpkg\\bootstrap-vcpkg.bat

      - name: Configure ${{ matrix.config.rid }}
        shell: bash
        run: |
          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}"
          CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_BUILD_SUFFIX=${{ inputs.build_suffix }}"
          if [ -n "${{ inputs.patch_override }}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_PATCH_OVERRIDE=${{ inputs.patch_override }}"
          fi
          if [ -n "${{ inputs.build_override }}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_BUILD_OVERRIDE=${{ inputs.build_override }}"
          fi
          CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_ENABLE_TESTS=ON"
          CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_ENABLE_PACKAGING=ON"
          cmake --preset ${{ matrix.config.preset }} $CMAKE_ARGS

      - name: Build ${{ matrix.config.rid }}
        run: cmake --build --preset ${{ matrix.config.preset }} --config ${{ matrix.config.build_type }}

      - name: Test ${{ matrix.config.rid }}
        run: ctest --preset ${{ matrix.config.preset }} -C ${{ matrix.config.build_type }} --output-on-failure

      - name: Build package ${{ matrix.config.rid }}
        run: cmake --build build/${{ matrix.config.preset }} --config ${{ matrix.config.build_type }} --target package

      - name: Restore NuGet packages
        run: dotnet restore nuget/vanillapdf.runtime.csproj

      - name: Execute nuget packaging
        run: dotnet pack nuget/vanillapdf.runtime.csproj --no-build --output .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: vanillapdf.runtime.${{ matrix.config.rid }}${{ inputs.build_suffix }}
          path: '*.nupkg'


  build-macos:
    name: ${{ matrix.config.rid }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - rid: osx-x64
            os: macos-15-intel
            preset: macos-x64
            build_type: Release

          - rid: osx-arm64
            os: macos-15
            preset: macos-arm64
            build_type: Release

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            build/${{ matrix.config.preset }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.config.rid }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.rid }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-${{ matrix.config.rid }}-

      # dotnet is available on macOS runners by default

      # TODO: Remove this workaround - see GitHub issue #125
      # Technical debt: technical/debt/macos-jpeg-conflict.md
      - name: Fix JPEG library conflicts (macOS) - TEMPORARY WORKAROUND
        run: |
          echo "=== Unlinking conflicting JPEG packages ==="
          brew unlink jpeg 2>/dev/null || echo "jpeg not linked or not found"
          brew unlink jpeg-turbo 2>/dev/null || echo "jpeg-turbo not linked or not found"
          brew unlink libjpeg 2>/dev/null || echo "libjpeg not linked or not found"

      # Bootstrap vcpkg on macOS
      - name: Bootstrap vcpkg (macOS)
        run: ${{ github.workspace }}/external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Configure ${{ matrix.config.rid }}
        run: |
          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}"
          CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_BUILD_SUFFIX=${{ inputs.build_suffix }}"
          if [ -n "${{ inputs.patch_override }}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_PATCH_OVERRIDE=${{ inputs.patch_override }}"
          fi
          if [ -n "${{ inputs.build_override }}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_BUILD_OVERRIDE=${{ inputs.build_override }}"
          fi
          CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_ENABLE_TESTS=ON"
          CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_ENABLE_PACKAGING=ON"
          cmake --preset ${{ matrix.config.preset }} $CMAKE_ARGS

      - name: Build ${{ matrix.config.rid }}
        run: cmake --build --preset ${{ matrix.config.preset }}

      - name: Test ${{ matrix.config.rid }}
        run: ctest --preset ${{ matrix.config.preset }}

      - name: Build package ${{ matrix.config.rid }}
        run: cmake --build build/${{ matrix.config.preset }} --target package

      - name: Restore NuGet packages
        run: dotnet restore nuget/vanillapdf.runtime.csproj

      - name: Execute nuget packaging
        run: dotnet pack nuget/vanillapdf.runtime.csproj --no-build --output .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: vanillapdf.runtime.${{ matrix.config.rid }}${{ inputs.build_suffix }}
          path: '*.nupkg'


  build-android:
    name: ${{ matrix.config.rid }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        config:
          - rid: android-arm64
            preset: android-arm64
            build_type: Release

          - rid: android-arm
            preset: android-arm
            build_type: Release

          - rid: android-x64
            preset: android-x64
            build_type: Release

          - rid: linux-bionic-arm64
            preset: linux-bionic-arm64
            build_type: Release

          - rid: linux-bionic-arm
            preset: linux-bionic-arm
            build_type: Release

          - rid: linux-bionic-x64
            preset: linux-bionic-x64
            build_type: Release

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve Android NDK path
        run: |
          NDK_PATH="$(python3 - <<'PY'
import glob
import os
import re
import sys

for env_key in ("ANDROID_NDK_ROOT", "ANDROID_NDK_HOME", "ANDROID_NDK_LATEST_HOME"):
    candidate = os.environ.get(env_key)
    if candidate and os.path.isdir(candidate):
        print(candidate)
        sys.exit(0)

bundle = "/usr/local/lib/android/sdk/ndk-bundle"
if os.path.isdir(bundle):
    print(bundle)
    sys.exit(0)

ndk_candidates = [p for p in glob.glob("/usr/local/lib/android/sdk/ndk/*") if os.path.isdir(p)]
if not ndk_candidates:
    sys.exit(1)

def sort_key(path):
    name = os.path.basename(path)
    return [int(part) if part.isdigit() else part for part in re.split(r"[.-]", name)]

ndk_candidates.sort(key=sort_key)
print(ndk_candidates[-1])
PY
          )"

          if [ -z "${NDK_PATH}" ] || [ ! -d "${NDK_PATH}" ]; then
            echo "Android NDK path could not be resolved."
            exit 1
          fi

          echo "ANDROID_NDK_ROOT=${NDK_PATH}" >> "${GITHUB_ENV}"
          echo "Using ANDROID_NDK_ROOT=${NDK_PATH}"

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            build/${{ matrix.config.preset }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/buildtrees
            external/vcpkg/packages
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.config.rid }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.rid }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-${{ matrix.config.rid }}-

      - name: Bootstrap vcpkg (Linux)
        run: ./external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Configure ${{ matrix.config.rid }}
        run: |
          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}"
          CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_BUILD_SUFFIX=${{ inputs.build_suffix }}"
          if [ -n "${{ inputs.patch_override }}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_PATCH_OVERRIDE=${{ inputs.patch_override }}"
          fi
          if [ -n "${{ inputs.build_override }}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_BUILD_OVERRIDE=${{ inputs.build_override }}"
          fi
          CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_ENABLE_TESTS=OFF"
          CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_ENABLE_PACKAGING=ON"
          cmake --preset ${{ matrix.config.preset }} $CMAKE_ARGS

      - name: Build ${{ matrix.config.rid }}
        run: cmake --build --preset ${{ matrix.config.preset }}

      - name: Build package ${{ matrix.config.rid }}
        run: cmake --build build/${{ matrix.config.preset }} --target package

      - name: Restore NuGet packages
        run: dotnet restore nuget/vanillapdf.runtime.csproj

      - name: Execute nuget packaging
        run: dotnet pack nuget/vanillapdf.runtime.csproj --no-build --output .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: vanillapdf.runtime.${{ matrix.config.rid }}${{ inputs.build_suffix }}
          path: '*.nupkg'


  build-vanillapdf-core:
    name: vanillapdf core
    runs-on: ubuntu-latest

    needs:
      - build-linux
      - build-linux-musl
      - build-windows
      - build-macos
      - build-android

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Generate NuGet project files
        run: |
          CMAKE_ARGS="-DVANILLAPDF_VERSION_BUILD_SUFFIX=${{ inputs.build_suffix }}"
          if [ -n "${{ inputs.patch_override }}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_PATCH_OVERRIDE=${{ inputs.patch_override }}"
          fi
          if [ -n "${{ inputs.build_override }}" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DVANILLAPDF_VERSION_BUILD_OVERRIDE=${{ inputs.build_override }}"
          fi
          cmake $CMAKE_ARGS -P cmake/nuget.cmake

      - name: Download runtime packages
        uses: actions/download-artifact@v7
        with:
          pattern: vanillapdf.runtime.*
          path: nuget/local-packages
          merge-multiple: true

      - name: Restore NuGet packages
        run: dotnet restore nuget/vanillapdf.csproj --configfile nuget/nuget.config

      - name: Execute nuget packaging
        run: dotnet pack nuget/vanillapdf.csproj --no-build --output .

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: vanillapdf${{ inputs.build_suffix }}
          path: '*.nupkg'
