name: Build NuGet Packages

on:
  workflow_call:
    inputs:
      build_suffix:
        required: false
        type: string
        default: ""

  # Allow triggering manually from the Actions tab
  workflow_dispatch:
    inputs:
      build_suffix:
        description: "Optional build suffix for version"
        required: false
        default: ""

  # Run package build on code changes
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build-nuget.yml'
      - 'nuget/**'
      - 'cmake/**'
      - 'vcpkg.json'

  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build-nuget.yml'
      - 'nuget/**'
      - 'cmake/**'
      - 'vcpkg.json'

permissions:
  contents: read  # Needed for future GitHub release or content access
  packages: read  # Needed for publishing NuGet packages within organization

env:
  VCPKG_DISABLE_METRICS: 1
  VCPKG_ROOT: external/vcpkg # vcpkg is by default sending build metrics, we do not need it here
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/external/vcpkg/bincache,readwrite"

jobs:

  build-linux:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: linux-x64
            os: ubuntu-24.04
            image: ghcr.io/vanillapdf/vanillapdf-rockylinux-amd64:9
            platform: linux/amd64
            preset: linux-x64-gcc
            build_type: Release

          - name: linux-arm64
            os: ubuntu-24.04-arm
            image: ghcr.io/vanillapdf/vanillapdf-rockylinux-arm64v8:9
            platform: linux/arm64
            preset: linux-arm64-gcc
            build_type: Release

    container:
      image: ${{ matrix.config.image }}
      options: --platform=${{ matrix.config.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install ICU dependencies
        if: runner.os == 'Linux'
        run: dnf -y install libicu

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.config.preset }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json', 'cmake/overlays/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-

      # Bootstrap vcpkg on Linux
      - name: Bootstrap vcpkg (Linux)
        run: ./external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Configure ${{ matrix.config.name }}
        run: cmake --preset ${{ matrix.config.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} -DVANILLAPDF_VERSION_BUILD_SUFFIX="${{ inputs.build_suffix }}"

      - name: Build ${{ matrix.config.name }}
        run: cmake --build --preset ${{ matrix.config.preset }}

      - name: Test ${{ matrix.config.name }}
        run: ctest --preset ${{ matrix.config.preset }}

      - name: Build package ${{ matrix.config.name }}
        run: cmake --build build/${{ matrix.config.preset }} --target package

      - name: Restore NuGet packages
        run: dotnet restore nuget/vanillapdf.runtime.csproj

      - name: Execute nuget packaging
        run: dotnet pack nuget/vanillapdf.runtime.csproj --no-build --output .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanillapdf.runtime.${{ matrix.config.name }}${{ inputs.build_suffix }}
          path: '*.nupkg'


  build-windows:
    name: ${{ matrix.config.name }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: win-x86
            preset: windows-x86-msvc-17
            build_type: Release

          - name: win-x64
            preset: windows-x64-msvc-17
            build_type: Release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.config.preset }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json', 'cmake/overlays/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-

      # Bootstrap vcpkg on Windows
      - name: Bootstrap vcpkg (Windows)
        run: ${{ github.workspace }}\\external\\vcpkg\\bootstrap-vcpkg.bat

      - name: Configure ${{ matrix.config.name }}
        run: cmake --preset ${{ matrix.config.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} -DVANILLAPDF_VERSION_BUILD_SUFFIX="${{ inputs.build_suffix }}"

      - name: Build ${{ matrix.config.name }}
        run: cmake --build --preset ${{ matrix.config.preset }} --config ${{ matrix.config.build_type }}

      - name: Test ${{ matrix.config.name }}
        run: ctest --preset ${{ matrix.config.preset }} -C ${{ matrix.config.build_type }} --output-on-failure

      - name: Build package ${{ matrix.config.name }}
        run: cmake --build build/${{ matrix.config.preset }} --config ${{ matrix.config.build_type }} --target package

      - name: Restore NuGet packages
        run: dotnet restore nuget/vanillapdf.runtime.csproj

      - name: Execute nuget packaging
        run: dotnet pack nuget/vanillapdf.runtime.csproj --no-build --output .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanillapdf.runtime.${{ matrix.config.name }}${{ inputs.build_suffix }}
          path: '*.nupkg'


  build-macos:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.runner }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: osx-x64
            runner: macos-13
            preset: macos-x64
            build_type: Release

          - name: osx-arm64
            runner: macos-15
            preset: macos-arm64
            build_type: Release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.config.preset }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json', 'cmake/overlays/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-

      # dotnet is available on macOS runners by default

      # Bootstrap vcpkg on macOS
      - name: Bootstrap vcpkg (macOS)
        run: ${{ github.workspace }}/external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Configure ${{ matrix.config.name }}
        run: cmake --preset ${{ matrix.config.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} -DVANILLAPDF_VERSION_BUILD_SUFFIX="${{ inputs.build_suffix }}"

      - name: Build ${{ matrix.config.name }}
        run: cmake --build --preset ${{ matrix.config.preset }}

      - name: Test ${{ matrix.config.name }}
        run: ctest --preset ${{ matrix.config.preset }}

      - name: Build package ${{ matrix.config.name }}
        run: cmake --build build/${{ matrix.config.preset }} --target package

      - name: Restore NuGet packages
        run: dotnet restore nuget/vanillapdf.runtime.csproj

      - name: Execute nuget packaging
        run: dotnet pack nuget/vanillapdf.runtime.csproj --no-build --output .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanillapdf.runtime.${{ matrix.config.name }}${{ inputs.build_suffix }}
          path: '*.nupkg'


  build-vanillapdf-core:
    name: vanillapdf core - ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    needs:
      - build-linux
      - build-windows
      - build-macos

    strategy:
      fail-fast: false

      matrix:
        config:
          - { name: "win.2025-x64", os: windows-2025, preset: "windows-x64-msvc-17", build_type: Release }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.config.preset }}/vcpkg_installed
            external/vcpkg/downloads
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json', 'cmake/overlays/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-

      # Bootstrap vcpkg on Windows
      - name: Bootstrap vcpkg (Windows)
        run: ${{ github.workspace }}\\external\\vcpkg\\bootstrap-vcpkg.bat

      - name: Configure
        run: cmake --preset ${{ matrix.config.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} -DVANILLAPDF_VERSION_BUILD_SUFFIX="${{ inputs.build_suffix }}"

      - name: Download runtime packages
        uses: actions/download-artifact@v4
        with:
          pattern: vanillapdf.runtime.*
          path: nuget/local-packages
          merge-multiple: true

      - name: Restore NuGet packages
        run: dotnet restore nuget/vanillapdf.csproj --configfile nuget/nuget.config

      - name: Execute nuget packaging
        run: dotnet pack nuget/vanillapdf.csproj --no-build --output .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanillapdf${{ inputs.build_suffix }}
          path: '*.nupkg'
