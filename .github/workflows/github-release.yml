name: Create GitHub Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
      latest:
        required: false
        type: boolean
        default: true
      target:
        description: "Commit SHA the tag is created at when the draft is published"
        required: false
        type: string
        default: ''
    outputs:
      release_id:
        description: "Numeric id of the draft release. Later jobs must address the draft by id, not tag: the tag does not exist as a ref until the draft is published, and an API edit to the draft body that omits tag_name resets it, after which tag-based lookup fails."
        value: ${{ jobs.github-release.outputs.release_id }}
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v1.2.3)"
        required: true
      prerelease:
        description: "Set to true for prerelease"
        required: true
        type: boolean
      latest:
        description: "Set as latest release"
        required: false
        type: boolean
        default: true
      target:
        description: "Commit SHA the tag is created at when the draft is published"
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    permissions:
      contents: write       # Required to create a release and upload assets
      id-token: write       # Required for Sigstore keyless signing
      attestations: write   # Required for GitHub artifact attestations

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Create draft release
        id: create
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          LATEST: ${{ inputs.latest }}
          TARGET: ${{ inputs.target }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Reuse the draft from an earlier attempt rather than creating a second
          # release for the same tag. A draft from a previous run has long since
          # propagated, so the list endpoint is safe to consult here - which is NOT
          # true of a draft created milliseconds ago (see below).
          RELEASE_ID=$(gh api "repos/${GH_REPO}/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)

          if [ -n "$RELEASE_ID" ]; then
            echo "Release $TAG already exists (id $RELEASE_ID). Skipping create."
          else
            echo "Creating draft release for tag: $TAG"

            MAKE_LATEST=true
            if [ "$LATEST" = "false" ]; then
              MAKE_LATEST=false
            fi

            TARGET_ARG=()
            if [ -n "$TARGET" ]; then
              TARGET_ARG=(-f target_commitish="$TARGET")
            fi

            # Create through the REST API, not `gh release create`, because the POST
            # response carries the new release's id. Re-reading the releases list to
            # find the id of a release created milliseconds earlier is a race: that
            # endpoint is eventually consistent and can return a stale page.
            #
            # The tag must NOT exist yet: publishing this draft is what creates the
            # tag (at TARGET) and binds the release to it. Pre-creating the tag would
            # leave the published release stuck on its untagged-* placeholder.
            RELEASE_ID=$(gh api --method POST "repos/${GH_REPO}/releases" \
              -f tag_name="$TAG" \
              -f name="vanillapdf $TAG" \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              -F generate_release_notes=true \
              -f make_latest="$MAKE_LATEST" \
              "${TARGET_ARG[@]}" \
              --jq .id)
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Could not resolve release id for $TAG"
            exit 1
          fi
          echo "Resolved release id: $RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Download DEB package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vanillapdf-deb
          path: ./packages/deb

      - name: Download RPM package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vanillapdf-rpm
          path: ./packages/rpm

      - name: Download DMG package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vanillapdf-dmg
          path: ./packages/dmg

      - name: Upload packages to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in ./packages/deb/*.deb ./packages/rpm/*.rpm ./packages/dmg/*.dmg; do
            if [ -f "$file" ]; then
              echo "Uploading: $file"
              gh release upload ${{ inputs.tag }} "$file"
            fi
          done

      - name: Attest package provenance
        id: attest-packages
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: |
            ./packages/deb/*.deb
            ./packages/rpm/*.rpm
            ./packages/dmg/*.dmg

      - name: Upload provenance to release
        # Attach the signed provenance bundle as a release asset. The attestation
        # also lives in GitHub's attestation store, but OpenSSF Scorecard's
        # Signed-Releases check only inspects release assets and credits a
        # *.intoto.jsonl provenance file.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_PATH: ${{ steps.attest-packages.outputs.bundle-path }}
          TAG: ${{ inputs.tag }}
        run: |
          PROVENANCE="vanillapdf-${TAG}.intoto.jsonl"
          cp "$BUNDLE_PATH" "$PROVENANCE"
          gh release upload "$TAG" "$PROVENANCE"

      - name: Generate SBOM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/dependency-graph/sbom \
            | jq '.sbom' > vanillapdf-${{ inputs.tag }}-sbom.spdx.json

      - name: Upload SBOM to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ inputs.tag }} vanillapdf-${{ inputs.tag }}-sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # v4.2.0
        with:
          subject-path: vanillapdf-${{ inputs.tag }}-sbom.spdx.json
          sbom-path: vanillapdf-${{ inputs.tag }}-sbom.spdx.json
