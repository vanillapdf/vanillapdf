name: Create GitHub Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v1.2.3)"
        required: true
      prerelease:
        description: "Set to true for prerelease"
        required: true
        type: boolean

permissions: {}

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Required to create a release and upload assets
      id-token: write       # Required for Sigstore keyless signing
      attestations: write   # Required for GitHub artifact attestations

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Create release from tag
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          echo "Creating draft release for tag: $TAG"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists. Skipping."
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" \
              --title "vanillapdf $TAG" \
              --generate-notes \
              --draft \
              --prerelease
          else
            gh release create "$TAG" \
              --title "vanillapdf $TAG" \
              --generate-notes \
              --draft
          fi

      - name: Generate SBOM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/dependency-graph/sbom \
            | jq '.sbom' > vanillapdf-${{ inputs.tag }}-sbom.spdx.json

      - name: Upload SBOM to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ inputs.tag }} vanillapdf-${{ inputs.tag }}-sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b  # v2.4.0
        with:
          subject-path: vanillapdf-${{ inputs.tag }}-sbom.spdx.json
          sbom-path: vanillapdf-${{ inputs.tag }}-sbom.spdx.json
