name: Create GitHub Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v1.2.3)"
        required: true
      prerelease:
        description: "Set to true for prerelease"
        required: true
        type: boolean

permissions:
  contents: write       # Required to create a release and upload assets
  id-token: write       # Required for Sigstore keyless signing
  attestations: write   # Required for GitHub artifact attestations

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create release from tag
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          echo "Creating draft release for tag: $TAG"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists. Skipping."
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" \
              --title "vanillapdf $TAG" \
              --generate-notes \
              --draft \
              --prerelease
          else
            gh release create "$TAG" \
              --title "vanillapdf $TAG" \
              --generate-notes \
              --draft
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: vanillapdf-${{ inputs.tag }}-sbom.spdx.json
          upload-release-assets: true

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: vanillapdf-${{ inputs.tag }}-sbom.spdx.json
          sbom-path: vanillapdf-${{ inputs.tag }}-sbom.spdx.json
