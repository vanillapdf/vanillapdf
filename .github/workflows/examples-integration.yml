name: Examples Integration

on:
  workflow_dispatch:

  # Weekly test on Sundays at 2 AM UTC
  schedule:
    - cron: '0 2 * * 0'

  # Run on changes that could affect examples
  push:
    branches: [ "main", "release/*" ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'vcpkg.json.in'
      - 'ports/**'
      - 'homebrew/**'
      - 'examples/**'
      - '.github/workflows/examples-integration.yml'

  pull_request:
    branches: [ "main", "release/*" ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'vcpkg.json.in'
      - 'ports/**'
      - 'homebrew/**'
      - 'examples/**'
      - '.github/workflows/examples-integration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: 1

jobs:
  setup:
    name: Setup Git Reference
    runs-on: ubuntu-latest
    outputs:
      git_tag: ${{ steps.git_ref.outputs.git_tag }}

    steps:
      - name: Configure Git reference for testing
        id: git_ref
        run: |
          echo "Testing examples integration against: ${{ github.ref_name }}"
          # For PR/push events, test against the branch instead of specific commit
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_TO_TEST="${{ github.head_ref }}"
          else
            BRANCH_TO_TEST="${{ github.ref_name }}"
          fi
          echo "Using branch: $BRANCH_TO_TEST"
          echo "git_tag=$BRANCH_TO_TEST" >> $GITHUB_OUTPUT

  # =============================================================================
  # FetchContent Integration Tests
  # =============================================================================

  fetchcontent-linux:
    name: FetchContent - Linux ${{ matrix.preset }}
    runs-on: ubuntu-latest
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        preset: [linux-x64-debug, linux-x64-release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev libjpeg-turbo8-dev zlib1g-dev libopenjp2-7-dev libopenjp2-tools

      - name: Configure CMake
        working-directory: examples/fetchcontent-integration
        run: |
          echo "Using Git tag: ${{ needs.setup.outputs.git_tag }}"
          cmake --preset ${{ matrix.preset }} \
            -DFETCHCONTENT_EXAMPLE_VANILLAPDF_GIT_TAG="${{ needs.setup.outputs.git_tag }}" \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_OPENSSL=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_JPEG=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_OPENJPEG=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_ZLIB=ON

      - name: Build
        working-directory: examples/fetchcontent-integration
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        working-directory: examples/fetchcontent-integration
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  fetchcontent-windows:
    name: FetchContent - Windows ${{ matrix.preset }}
    runs-on: windows-latest
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        preset: [windows-x64-debug, windows-x64-release]
        include:
          - preset: windows-x64-debug
            build_type: Debug
          - preset: windows-x64-release
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Visual Studio
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        working-directory: examples/fetchcontent-integration
        shell: bash
        run: |
          echo "Using Git tag: ${{ needs.setup.outputs.git_tag }}"
          cmake --preset ${{ matrix.preset }} \
            -DFETCHCONTENT_EXAMPLE_VANILLAPDF_GIT_TAG="${{ needs.setup.outputs.git_tag }}"

      - name: Build
        working-directory: examples/fetchcontent-integration
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: examples/fetchcontent-integration
        run: ctest --preset ${{ matrix.preset }} -C ${{ matrix.build_type }} --output-on-failure

  fetchcontent-macos:
    name: FetchContent - macOS ${{ matrix.preset }}
    runs-on: macos-latest
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        preset: [macos-arm64-debug, macos-arm64-release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: brew install ninja openssl@3 jpeg-turbo zlib openjpeg

      - name: Configure CMake
        working-directory: examples/fetchcontent-integration
        run: |
          echo "Using Git tag: ${{ needs.setup.outputs.git_tag }}"
          cmake --preset ${{ matrix.preset }} \
            -DFETCHCONTENT_EXAMPLE_VANILLAPDF_GIT_TAG="${{ needs.setup.outputs.git_tag }}" \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_OPENSSL=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_JPEG=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_OPENJPEG=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_ZLIB=ON

      - name: Build
        working-directory: examples/fetchcontent-integration
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        working-directory: examples/fetchcontent-integration
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # =============================================================================
  # vcpkg Port Integration Tests (uses --head to test current branch)
  # =============================================================================

  vcpkg-port-linux:
    name: vcpkg Port - Linux ${{ matrix.preset }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [linux-x64-debug, linux-x64-release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh

      - name: Update portfile to use current branch
        run: ./scripts/update_portfile_branch.sh "${{ github.head_ref || github.ref_name }}"

      - name: Install vanillapdf via vcpkg (classic mode with --head)
        run: ./external/vcpkg/vcpkg install vanillapdf --head --overlay-ports=./ports --triplet=x64-linux

      - name: Configure CMake
        working-directory: examples/vcpkg-port-integration
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: examples/vcpkg-port-integration
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        working-directory: examples/vcpkg-port-integration
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  vcpkg-port-windows:
    name: vcpkg Port - Windows ${{ matrix.preset }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [windows-x64-debug, windows-x64-release]
        include:
          - preset: windows-x64-debug
            build_type: Debug
          - preset: windows-x64-release
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Visual Studio
        uses: microsoft/setup-msbuild@v2

      - name: Bootstrap vcpkg
        run: .\external\vcpkg\bootstrap-vcpkg.bat

      - name: Update portfile to use current branch
        shell: bash
        run: ./scripts/update_portfile_branch.sh "${{ github.head_ref || github.ref_name }}"

      - name: Install vanillapdf via vcpkg (classic mode with --head)
        run: .\external\vcpkg\vcpkg.exe install vanillapdf --head --overlay-ports=./ports --triplet=x64-windows

      - name: Configure CMake
        working-directory: examples/vcpkg-port-integration
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: examples/vcpkg-port-integration
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: examples/vcpkg-port-integration
        run: ctest --preset ${{ matrix.preset }} -C ${{ matrix.build_type }} --output-on-failure

  vcpkg-port-macos:
    name: vcpkg Port - macOS ${{ matrix.preset }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [macos-arm64-debug, macos-arm64-release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install --quiet ninja autoconf automake autoconf-archive

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh

      - name: Update portfile to use current branch
        run: ./scripts/update_portfile_branch.sh "${{ github.head_ref || github.ref_name }}"

      - name: Install vanillapdf via vcpkg (classic mode with --head)
        run: ./external/vcpkg/vcpkg install vanillapdf --head --overlay-ports=./ports --triplet=arm64-osx

      - name: Configure CMake
        working-directory: examples/vcpkg-port-integration
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: examples/vcpkg-port-integration
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        working-directory: examples/vcpkg-port-integration
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # =============================================================================
  # Homebrew Integration Tests (validates formula can be consumed)
  # =============================================================================

  homebrew-macos:
    name: Homebrew - macOS ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            preset: macos-arm64-release
          - runner: macos-15-intel
            preset: macos-x64-release

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false  # No vcpkg needed for Homebrew test

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install ninja openssl@3 jpeg-turbo zlib openjpeg

      - name: Generate formula for current branch
        run: cmake -DVANILLAPDF_HEAD_BRANCH="${{ github.head_ref || github.ref_name }}" -P cmake/configure_homebrew_formula.cmake

      - name: Install vanillapdf via Homebrew formula (--HEAD)
        run: |
          # Create a local tap so Homebrew accepts the formula
          brew tap-new --no-git vanillapdf/test
          cp ./homebrew/vanillapdf.rb "$(brew --repository vanillapdf/test)/Formula/vanillapdf.rb"
          # Install from the local tap, building from HEAD (current branch)
          brew install --build-from-source --HEAD vanillapdf/test/vanillapdf

      - name: Verify installation
        run: |
          # Check library exists
          ls -la $(brew --prefix)/lib/libvanillapdf*
          # Check CLI tool works
          vanillapdf.tools --version

      - name: Configure integration test
        working-directory: examples/homebrew-integration
        run: cmake --preset ${{ matrix.preset }}

      - name: Build integration test
        working-directory: examples/homebrew-integration
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run integration test
        working-directory: examples/homebrew-integration
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
