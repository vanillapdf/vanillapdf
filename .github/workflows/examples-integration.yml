name: Examples Integration

on:
  workflow_dispatch:

  # Weekly test on Sundays at 2 AM UTC
  schedule:
    - cron: '0 2 * * 0'

  # Run on changes that could affect examples
  push:
    branches: [ "main", "release/*" ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'vcpkg.json.in'
      - 'ports/**'
      - 'homebrew/**'
      - 'conan/**'
      - 'examples/**'
      - '.github/workflows/examples-integration.yml'

  pull_request:
    branches: [ "main", "release/*" ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'vcpkg.json.in'
      - 'ports/**'
      - 'homebrew/**'
      - 'conan/**'
      - 'examples/**'
      - '.github/workflows/examples-integration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: 1

jobs:
  setup:
    name: Setup Git Reference
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      git_tag: ${{ steps.git_ref.outputs.git_tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure Git reference for testing
        id: git_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "Testing examples integration against: $REF_NAME"
          # For PR/push events, test against the branch instead of specific commit
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH_TO_TEST="$HEAD_REF"
          else
            BRANCH_TO_TEST="$REF_NAME"
          fi
          echo "Using branch: $BRANCH_TO_TEST"
          echo "git_tag=$BRANCH_TO_TEST" >> $GITHUB_OUTPUT

      - name: Extract version from cmake/version.cmake
        id: version
        run: |
          MAJOR=$(grep 'VANILLAPDF_VERSION_MAJOR' cmake/version.cmake | head -1 | grep -oP '\d+')
          MINOR=$(grep 'VANILLAPDF_VERSION_MINOR' cmake/version.cmake | head -1 | grep -oP '\d+')
          PATCH=$(grep 'VANILLAPDF_VERSION_PATCH' cmake/version.cmake | head -1 | grep -oP '\d+')
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${MAJOR}.${MINOR}.${PATCH}"

  # =============================================================================
  # FetchContent Integration Tests
  # =============================================================================

  fetchcontent-linux:
    name: FetchContent - Linux ${{ matrix.preset }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        preset: [linux-x64-debug, linux-x64-release]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev libjpeg-turbo8-dev zlib1g-dev libopenjp2-7-dev libopenjp2-tools

      - name: Configure CMake
        working-directory: examples/fetchcontent-integration
        run: |
          echo "Using Git tag: ${{ needs.setup.outputs.git_tag }}"
          cmake --preset ${{ matrix.preset }} \
            -DFETCHCONTENT_EXAMPLE_VANILLAPDF_GIT_TAG="${{ needs.setup.outputs.git_tag }}" \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_OPENSSL=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_JPEG=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_OPENJPEG=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_ZLIB=ON

      - name: Build
        working-directory: examples/fetchcontent-integration
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        working-directory: examples/fetchcontent-integration
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  fetchcontent-windows:
    name: FetchContent - Windows ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 90
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        preset: [windows-x64-debug, windows-x64-release]
        include:
          - preset: windows-x64-debug
            build_type: Debug
          - preset: windows-x64-release
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Visual Studio
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3.0.0

      - name: Configure CMake
        working-directory: examples/fetchcontent-integration
        shell: bash
        run: |
          echo "Using Git tag: ${{ needs.setup.outputs.git_tag }}"
          cmake --preset ${{ matrix.preset }} \
            -DFETCHCONTENT_EXAMPLE_VANILLAPDF_GIT_TAG="${{ needs.setup.outputs.git_tag }}"

      - name: Build
        working-directory: examples/fetchcontent-integration
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: examples/fetchcontent-integration
        run: ctest --preset ${{ matrix.preset }} -C ${{ matrix.build_type }} --output-on-failure

  fetchcontent-macos:
    name: FetchContent - macOS ${{ matrix.preset }}
    runs-on: macos-26
    timeout-minutes: 90
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        preset: [macos-arm64-debug, macos-arm64-release]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: brew install ninja openssl@3 jpeg-turbo zlib openjpeg

      - name: Configure CMake
        working-directory: examples/fetchcontent-integration
        run: |
          echo "Using Git tag: ${{ needs.setup.outputs.git_tag }}"
          cmake --preset ${{ matrix.preset }} \
            -DFETCHCONTENT_EXAMPLE_VANILLAPDF_GIT_TAG="${{ needs.setup.outputs.git_tag }}" \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_OPENSSL=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_JPEG=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_OPENJPEG=ON \
            -DFETCHCONTENT_EXAMPLE_EXTERNAL_ZLIB=ON

      - name: Build
        working-directory: examples/fetchcontent-integration
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        working-directory: examples/fetchcontent-integration
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # =============================================================================
  # vcpkg Port Integration Tests (uses --head to test current branch)
  # =============================================================================

  vcpkg-port-linux:
    name: vcpkg Port - Linux ${{ matrix.preset }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        preset: [linux-x64-debug, linux-x64-release]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh

      - name: Update portfile to use current branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update_portfile_branch.sh "$BRANCH"

      - name: Install vanillapdf via vcpkg (classic mode with --head)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VCPKG_KEEP_ENV_VARS: GITHUB_TOKEN
        run: ./external/vcpkg/vcpkg install vanillapdf --head --overlay-ports=./ports --triplet=x64-linux

      - name: Configure CMake
        working-directory: examples/vcpkg-port-integration
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: examples/vcpkg-port-integration
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        working-directory: examples/vcpkg-port-integration
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  vcpkg-port-windows:
    name: vcpkg Port - Windows ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        preset: [windows-x64-debug, windows-x64-release]
        include:
          - preset: windows-x64-debug
            build_type: Debug
          - preset: windows-x64-release
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Set up Visual Studio
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3.0.0

      - name: Bootstrap vcpkg
        run: .\external\vcpkg\bootstrap-vcpkg.bat

      - name: Update portfile to use current branch
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update_portfile_branch.sh "$BRANCH"

      - name: Install vanillapdf via vcpkg (classic mode with --head)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VCPKG_KEEP_ENV_VARS: GITHUB_TOKEN
        run: .\external\vcpkg\vcpkg.exe install vanillapdf --head --overlay-ports=./ports --triplet=x64-windows

      - name: Configure CMake
        working-directory: examples/vcpkg-port-integration
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: examples/vcpkg-port-integration
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: examples/vcpkg-port-integration
        run: ctest --preset ${{ matrix.preset }} -C ${{ matrix.build_type }} --output-on-failure

  vcpkg-port-macos:
    name: vcpkg Port - macOS ${{ matrix.preset }}
    runs-on: macos-26
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        preset: [macos-arm64-debug, macos-arm64-release]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install --quiet ninja autoconf automake autoconf-archive

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh

      - name: Update portfile to use current branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update_portfile_branch.sh "$BRANCH"

      - name: Install vanillapdf via vcpkg (classic mode with --head)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VCPKG_KEEP_ENV_VARS: GITHUB_TOKEN
        run: ./external/vcpkg/vcpkg install vanillapdf --head --overlay-ports=./ports --triplet=arm64-osx

      - name: Configure CMake
        working-directory: examples/vcpkg-port-integration
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: examples/vcpkg-port-integration
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        working-directory: examples/vcpkg-port-integration
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # =============================================================================
  # Homebrew Integration Tests (validates formula can be consumed)
  # =============================================================================

  homebrew-macos:
    name: Homebrew - macOS ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            preset: macos-arm64-release

          # Intel is deliberately absent. Homebrew moved macOS x86_64 to tier 3
          # in September 2026 - CI support stopped and no further bottles are
          # built - and stops running on Intel altogether in September 2027.
          # macOS 27 requires Apple Silicon, so homebrew-core will not bottle
          # vanillapdf for Intel either, and this job would be validating a
          # formula no Homebrew user can install.
          # https://docs.brew.sh/Support-Tiers
          # https://www.macrumors.com/2026/04/18/macos-27-compatibility-change/
          #
          # Only Homebrew coverage is dropped. Intel is still built and tested
          # through vcpkg and CMake in sanity-check, nightly-check and
          # build-nuget, none of which depend on bottles.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false  # No vcpkg needed for Homebrew test

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install ninja openssl@3 jpeg-turbo zlib openjpeg

      - name: Generate formula for current branch
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: cmake -DVANILLAPDF_HEAD_BRANCH="$HEAD_BRANCH" -P cmake/configure_homebrew_formula.cmake

      - name: Install vanillapdf via Homebrew formula (--HEAD)
        run: |
          # Create a local tap so Homebrew accepts the formula
          brew tap-new --no-git vanillapdf/test
          cp ./homebrew/vanillapdf.rb "$(brew --repository vanillapdf/test)/Formula/vanillapdf.rb"
          # Install from the local tap, building from HEAD (current branch)
          brew install --build-from-source --HEAD vanillapdf/test/vanillapdf

      - name: Verify installation
        run: |
          # Check library exists
          ls -la $(brew --prefix)/lib/libvanillapdf*

      - name: Configure integration test
        working-directory: examples/homebrew-integration
        run: cmake --preset ${{ matrix.preset }}

      - name: Build integration test
        working-directory: examples/homebrew-integration
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run integration test
        working-directory: examples/homebrew-integration
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # =============================================================================
  # Conan Integration Tests
  # =============================================================================

  conan-linux:
    name: Conan - Linux ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: setup
    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/vanillapdf/vanillapdf-ubuntu-amd64:24.04
      options: --platform=linux/amd64

    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            conan_preset: conan-release
          - build_type: Debug
            conan_preset: conan-debug

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect Conan profile
        run: conan profile detect

      - name: Create vanillapdf Conan package
        run: conan create conan/ --version=${{ needs.setup.outputs.version }} --build=missing -s compiler.cppstd=17

      - name: Configure example conanfile
        run: cmake "-DVANILLAPDF_VERSION=${{ needs.setup.outputs.version }}" -P cmake/configure_conan_example.cmake

      - name: Install example dependencies
        working-directory: examples/conan-integration
        run: conan install . --build=missing -s compiler.cppstd=17 -s build_type=${{ matrix.build_type }}

      - name: Configure CMake
        working-directory: examples/conan-integration
        run: cmake --preset ${{ matrix.conan_preset }}

      - name: Build
        working-directory: examples/conan-integration
        run: cmake --build --preset ${{ matrix.conan_preset }}

      - name: Test
        working-directory: examples/conan-integration
        run: ctest --preset ${{ matrix.conan_preset }} --output-on-failure

  conan-windows:
    name: Conan - Windows ${{ matrix.build_type }}
    runs-on: windows-latest
    timeout-minutes: 90
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            conan_preset: conan-release
          - build_type: Debug
            conan_preset: conan-debug

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Visual Studio
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3.0.0

      - name: Install Conan
        shell: cmd
        run: |
          choco install conan --yes
          call refreshenv
          conan profile detect

      - name: Add Conan to PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Conan\conan"

      - name: Create vanillapdf Conan package
        run: conan create conan/ --version=${{ needs.setup.outputs.version }} --build=missing -s compiler.cppstd=17

      - name: Configure example conanfile
        run: cmake "-DVANILLAPDF_VERSION=${{ needs.setup.outputs.version }}" -P cmake/configure_conan_example.cmake

      - name: Install example dependencies
        working-directory: examples/conan-integration
        run: conan install . --build=missing -s compiler.cppstd=17 -s build_type=${{ matrix.build_type }}

      - name: Configure CMake
        working-directory: examples/conan-integration
        run: cmake --preset conan-default

      - name: Build
        working-directory: examples/conan-integration
        run: cmake --build --preset ${{ matrix.conan_preset }}

      - name: Test
        working-directory: examples/conan-integration
        run: ctest --preset ${{ matrix.conan_preset }} --output-on-failure

  conan-macos:
    name: Conan - macOS ${{ matrix.build_type }}
    runs-on: macos-26
    timeout-minutes: 90
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            conan_preset: conan-release
          - build_type: Debug
            conan_preset: conan-debug

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build tools
        run: brew install ninja conan

      - name: Detect Conan profile
        run: conan profile detect

      - name: Create vanillapdf Conan package
        run: conan create conan/ --version=${{ needs.setup.outputs.version }} --build=missing -s compiler.cppstd=17

      - name: Configure example conanfile
        run: cmake "-DVANILLAPDF_VERSION=${{ needs.setup.outputs.version }}" -P cmake/configure_conan_example.cmake

      - name: Install example dependencies
        working-directory: examples/conan-integration
        run: conan install . --build=missing -s compiler.cppstd=17 -s build_type=${{ matrix.build_type }}

      - name: Configure CMake
        working-directory: examples/conan-integration
        run: cmake --preset ${{ matrix.conan_preset }}

      - name: Build
        working-directory: examples/conan-integration
        run: cmake --build --preset ${{ matrix.conan_preset }}

      - name: Test
        working-directory: examples/conan-integration
        run: ctest --preset ${{ matrix.conan_preset }} --output-on-failure
