name: Coverage

on:
  push:
    branches:
      - main
      - 'release/*'
    paths:
      - '.github/workflows/coverage.yml'
      - '.codecov.yml'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'test/**'

  pull_request:
    branches:
      - main
      - 'release/*'
    paths:
      - '.github/workflows/coverage.yml'
      - '.codecov.yml'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'test/**'

permissions:
  contents: read  # Download the repository source code
  statuses: write  # Required for Codecov to post coverage status
  pull-requests: write  # Required for PR comments

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install tools
        run: sudo apt-get install -y lcov gcovr

      - name: Configure CMake with coverage
        run: cmake --preset linux-x64-gcc -DVANILLAPDF_ENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build ${{ matrix.config.name }}
        run: cmake --build --preset linux-x64-gcc

      - name: Test ${{ matrix.config.name }}
        run: ctest --preset linux-x64-gcc

      - name: Generate coverage report
        run: gcovr -r . --xml-pretty -o coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
