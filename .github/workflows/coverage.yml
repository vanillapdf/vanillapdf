name: Coverage

on:
  push:
    branches:
      - main
      - 'release/*'
    paths:
      - '.github/workflows/coverage.yml'
      - '.codecov.yml'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'test/**'

  pull_request:
    branches:
      - main
      - 'release/*'
    paths:
      - '.github/workflows/coverage.yml'
      - '.codecov.yml'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'test/**'

permissions: {}

env:
  VCPKG_DISABLE_METRICS: 1
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/external/vcpkg/bincache,readwrite"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # Download the repository source code
      statuses: write       # Required for Codecov to post coverage status
      pull-requests: write  # Required for PR comments

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: recursive

      - name: Install tools
        run: sudo apt-get install -y lcov gcovr

      - name: Cache vcpkg
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
        with:
          path: |
            external/vcpkg/downloads
            external/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-ubuntu-24.04-x64-gcc-${{ hashFiles('vcpkg.json.in') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-ubuntu-24.04-x64-gcc-

      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Configure CMake with coverage
        run: cmake --preset linux-x64-gcc -DVANILLAPDF_ENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug -DVANILLAPDF_ENABLE_TESTS=ON

      - name: Build ${{ matrix.config.name }}
        run: cmake --build --preset linux-x64-gcc

      - name: Test ${{ matrix.config.name }}
        run: ctest --preset linux-x64-gcc

      - name: Generate coverage report
        run: gcovr -r . --xml-pretty -o coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad  # v5.5.3
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
