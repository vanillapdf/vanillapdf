# Deploy doxygen generated documentation to GitHub Pages site
name: Generate doxygen

on:
  # Runs when a version tag is pushed
  push:
    tags:
      - 'v*.*.*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Determine if the pushed tag is the latest
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Determine latest tag
        id: check
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if [[ "$tag" == *-* ]]; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          else
            latest=$(git tag -l 'v*.*.*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
            if [ "$latest" = "$tag" ]; then
              echo "is_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # Build job
  build:
    if: needs.check-tag.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    needs: check-tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Generate doxyfile
        run: cmake -P cmake/docs.cmake

      - name: Build doxygen
        run: doxygen doxyfile
        working-directory: doc

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload html subfolder generated in doc
          path: 'doc/api/html'

  # Deployment job
  deploy:
    if: needs.check-tag.outputs.is_latest == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: [check-tag, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
