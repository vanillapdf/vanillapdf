# This is a basic workflow to help you get started with Actions

name: Nightly full scan

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  schedule:
    - cron: '0 2 * * *'  # Every day at 2 AM UTC

# Enable only minimum required permissions
permissions:
  contents: read    # Download the repository source code
  packages: read    # Needed to load container images

env:
  VCPKG_ROOT: external/vcpkg
  VCPKG_DISABLE_METRICS: 1 # vcpkg is by default sending build metrics, we do not need it here

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  nightly-full-scan:
    name: Configuration ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    container:
      image: ${{ matrix.config.image }}

    strategy:
      # We would like to see the results of all jobs even in case one of them fails
      fail-fast: false

      matrix:
        config:
          # windows
          - { name: "win.2019-x86"  , os: windows-2019,     preset: "windows-x86-msvc-ninja", configuration: Release }
          - { name: "win.2022-x86"  , os: windows-2022,     preset: "windows-x86-msvc-ninja", configuration: Release }
          - { name: "win.2025-x86"  , os: windows-2025,     preset: "windows-x86-msvc-ninja", configuration: Release }

          - { name: "win.2019-x64"  , os: windows-2019,     preset: "windows-x64-msvc-ninja", configuration: Release }
          - { name: "win.2022-x64"  , os: windows-2022,     preset: "windows-x64-msvc-ninja", configuration: Release }
          - { name: "win.2025-x64"  , os: windows-2025,     preset: "windows-x64-msvc-ninja", configuration: Release }

          # osx
          - { name: "osx.13-x64"        , os: macos-13,     preset: "macos-x64",    configuration: Release }
          - { name: "osx.14-arm64"      , os: macos-14,     preset: "macos-arm64",  configuration: Release }
          - { name: "osx.15-arm64"      , os: macos-15,     preset: "macos-arm64",  configuration: Release }

          # ubuntu
          - { name: "ubuntu.22.04-x64",     os: ubuntu-latest,  preset: "linux-x64-gcc",    configuration: Release, image: 'ghcr.io/vanillapdf/vanillapdf-ubuntu-amd64:22.04' }
          - { name: "ubuntu.22.04-arm64",   os: ubuntu-latest,  preset: "linux-arm64-gcc",  configuration: Release, image: 'ghcr.io/vanillapdf/vanillapdf-ubuntu-arm64v8:22.04' }
          - { name: "ubuntu.24.04-x64",     os: ubuntu-latest,  preset: "linux-x64-gcc",    configuration: Release, image: 'ghcr.io/vanillapdf/vanillapdf-ubuntu-amd64:24.04' }
          - { name: "ubuntu.24.04-arm64",   os: ubuntu-latest,  preset: "linux-arm64-gcc",  configuration: Release, image: 'ghcr.io/vanillapdf/vanillapdf-ubuntu-arm64v8:24.04' }
          
          # rockylinux
          - { name: "rocky.8-x64",      os: ubuntu-latest,  preset: "linux-x64-gcc",    configuration: Release, image: 'ghcr.io/vanillapdf/vanillapdf-rockylinux-amd64:8' }
          - { name: "rocky.8-arm64",    os: ubuntu-latest,  preset: "linux-arm64-gcc",  configuration: Release, image: 'ghcr.io/vanillapdf/vanillapdf-rockylinux-arm64v8:8' }
          - { name: "rocky.9-x64",      os: ubuntu-latest,  preset: "linux-x64-gcc",    configuration: Release, image: 'ghcr.io/vanillapdf/vanillapdf-rockylinux-amd64:9' }
          - { name: "rocky.9-arm64",    os: ubuntu-latest,  preset: "linux-arm64-gcc",  configuration: Release, image: 'ghcr.io/vanillapdf/vanillapdf-rockylinux-arm64v8:9' }

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg installed
        uses: actions/cache@v4
        with:
          path: |
            build/vcpkg_installed
            external/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ matrix.config.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.config.preset }}-
            vcpkg-${{ runner.os }}-

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake autoconf-archive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y autoconf automake libtool pkg-config

      # Cross-platform vcpkg bootstrap handling
      - name: Bootstrap vcpkg
        uses: ./.github/actions/bootstrap-vcpkg

      # Generate the build files
      - name: Generate build files
        run: cmake --preset ${{ matrix.config.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.config.configuration }}

      # Build the project
      - name: Build project in config ${{ matrix.config.name }}
        run: cmake --build --preset ${{ matrix.config.preset }}

      # Run tests
      - name: Run automated test scenarios in config ${{ matrix.config.name }}
        run: ctest --preset ${{ matrix.config.preset }} --output-on-failure
