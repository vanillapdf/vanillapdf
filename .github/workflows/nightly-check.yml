# This is a basic workflow to help you get started with Actions

name: Nightly full scan

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Run workflow on any push into main branch
  # only there was a change in the workflow file
  push:
    branches: [ "main", "release/*" ]
    paths:
      - '.github/workflows/nightly-check.yml'
      - 'vcpkg.json.in'

  # Run workflow when there is a pull request towards main branch
  # only there was a change in the workflow file
  pull_request:
    branches: [ "main", "release/*" ]
    paths:
      - '.github/workflows/nightly-check.yml'
      - 'vcpkg.json.in'

  schedule:
    - cron: '0 2 * * 1'  # Every on Monday at 2 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Enable only minimum required permissions
permissions:
  contents: read    # Download the repository source code
  packages: read    # Needed to load container images

env:
  VCPKG_ROOT: external/vcpkg
  VCPKG_DISABLE_METRICS: 1 # vcpkg is by default sending build metrics, we do not need it here
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/external/vcpkg/bincache,readwrite"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  linux:
    name: ${{ matrix.config.name }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        build_type: [Debug, Release]

        config:
          - name: ubuntu.22.04-x64
            os: ubuntu-24.04
            image: ghcr.io/vanillapdf/vanillapdf-ubuntu-amd64:22.04
            platform: linux/amd64
            preset: linux-x64-gcc

          # TODO:
          # Ubuntu 22.04 arm image cannot be built on windows due to QEMU bug
          # - name: ubuntu.22.04-arm64
          #   os: ubuntu-24.04-arm
          #   image: ghcr.io/vanillapdf/vanillapdf-ubuntu-arm64v8:22.04
          #   platform: linux/arm64
          #   preset: linux-arm64-gcc

          - name: ubuntu.24.04-x64
            os: ubuntu-24.04
            image: ghcr.io/vanillapdf/vanillapdf-ubuntu-amd64:24.04
            platform: linux/amd64
            preset: linux-x64-gcc

          - name: ubuntu.24.04-arm64
            os: ubuntu-24.04-arm
            image: ghcr.io/vanillapdf/vanillapdf-ubuntu-arm64v8:24.04
            platform: linux/arm64
            preset: linux-arm64-gcc

          - name: ubuntu.26.04-x64
            os: ubuntu-24.04
            image: ghcr.io/vanillapdf/vanillapdf-ubuntu:26.04
            platform: linux/amd64
            preset: linux-x64-gcc

          - name: ubuntu.26.04-arm64
            os: ubuntu-24.04-arm
            image: ghcr.io/vanillapdf/vanillapdf-ubuntu:26.04
            platform: linux/arm64
            preset: linux-arm64-gcc

          - name: rocky.8-x64
            os: ubuntu-24.04
            image: ghcr.io/vanillapdf/vanillapdf-rockylinux-amd64:8
            platform: linux/amd64
            preset: linux-x64-gcc

          - name: rocky.8-arm64
            os: ubuntu-24.04-arm
            image: ghcr.io/vanillapdf/vanillapdf-rockylinux-arm64v8:8
            platform: linux/arm64
            preset: linux-arm64-gcc

          - name: rocky.9-x64
            os: ubuntu-24.04
            image: ghcr.io/vanillapdf/vanillapdf-rockylinux-amd64:9
            platform: linux/amd64
            preset: linux-x64-gcc

          - name: rocky.9-arm64
            os: ubuntu-24.04-arm
            image: ghcr.io/vanillapdf/vanillapdf-rockylinux-arm64v8:9
            platform: linux/arm64
            preset: linux-arm64-gcc

          - name: rocky.10-x64
            os: ubuntu-24.04
            image: ghcr.io/vanillapdf/vanillapdf-rockylinux:10
            platform: linux/amd64
            preset: linux-x64-gcc

          - name: rocky.10-arm64
            os: ubuntu-24.04-arm
            image: ghcr.io/vanillapdf/vanillapdf-rockylinux:10
            platform: linux/arm64
            preset: linux-arm64-gcc

          - name: fedora.43-x64
            os: ubuntu-24.04
            image: ghcr.io/vanillapdf/vanillapdf-fedora:43
            platform: linux/amd64
            preset: linux-x64-gcc

          - name: fedora.43-arm64
            os: ubuntu-24.04-arm
            image: ghcr.io/vanillapdf/vanillapdf-fedora:43
            platform: linux/arm64
            preset: linux-arm64-gcc

          - name: fedora.44-x64
            os: ubuntu-24.04
            image: ghcr.io/vanillapdf/vanillapdf-fedora:44
            platform: linux/amd64
            preset: linux-x64-gcc

          - name: fedora.44-arm64
            os: ubuntu-24.04-arm
            image: ghcr.io/vanillapdf/vanillapdf-fedora:44
            platform: linux/arm64
            preset: linux-arm64-gcc

    container:
      image: ${{ matrix.config.image }}
      options: --platform=${{ matrix.config.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      # Note: vcpkg caching disabled for Linux weekly scan to reduce cache storage usage.
      # Different distros use different GCC versions, producing distinct ABI hashes that
      # cannot share a cache entry. Caching all distros separately would exceed budget.

      - name: Bootstrap vcpkg (Linux)
        run: ./external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Configure ${{ matrix.config.preset }}
        run: cmake --preset ${{ matrix.config.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DVANILLAPDF_ENABLE_TESTS=ON

      - name: Build ${{ matrix.config.preset }}
        run: cmake --build --preset ${{ matrix.config.preset }}

      - name: Test ${{ matrix.config.preset }}
        run: ctest --preset ${{ matrix.config.preset }} --output-on-failure


  windows:
    name: ${{ matrix.config.name }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:

        # There are some issues with win-x86 in debug, that prevent us to use it
        build_type: [Release]

        config:
          # Static dependencies + Static CRT (for NuGet builds)
          - { name: "win.2022-x86-static", os: windows-2022, preset: "windows-x86-msvc-17-static" }
          - { name: "win.2022-x64-static", os: windows-2022, preset: "windows-x64-msvc-17-static" }
          - { name: "win.2025-x86-static", os: windows-2025, preset: "windows-x86-msvc-18-static" }
          - { name: "win.2025-x64-static", os: windows-2025, preset: "windows-x64-msvc-18-static" }
          - { name: "win.11-arm64-static", os: windows-11-arm, preset: "windows-arm64-msvc-17-static" }

          # Static dependencies + Dynamic CRT (for Python wrappers)
          - { name: "win.2022-x86-static-md", os: windows-2022, preset: "windows-x86-msvc-17-static-md" }
          - { name: "win.2022-x64-static-md", os: windows-2022, preset: "windows-x64-msvc-17-static-md" }
          - { name: "win.2025-x86-static-md", os: windows-2025, preset: "windows-x86-msvc-18-static-md" }
          - { name: "win.2025-x64-static-md", os: windows-2025, preset: "windows-x64-msvc-18-static-md" }
          - { name: "win.11-arm64-static-md", os: windows-11-arm, preset: "windows-arm64-msvc-17-static-md" }

          # Dynamic dependencies + Dynamic CRT
          - { name: "win.2022-x86", os: windows-2022, preset: "windows-x86-msvc-17" }
          - { name: "win.2022-x64", os: windows-2022, preset: "windows-x64-msvc-17" }
          - { name: "win.2025-x86", os: windows-2025, preset: "windows-x86-msvc-18" }
          - { name: "win.2025-x64", os: windows-2025, preset: "windows-x64-msvc-18" }
          - { name: "win.11-arm64", os: windows-11-arm, preset: "windows-arm64-msvc-17" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      # Note: vcpkg caching disabled for Windows weekly scan to reduce cache storage usage
      # Windows has many configurations (15+) and caches are large (~2-3GB each)

      - name: Bootstrap vcpkg (Windows)
        run: ${{ github.workspace }}\\external\\vcpkg\\bootstrap-vcpkg.bat

      - name: Configure ${{ matrix.config.preset }}
        run: cmake --preset ${{ matrix.config.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DVANILLAPDF_ENABLE_TESTS=ON

      - name: Build ${{ matrix.config.preset }}
        run: cmake --build --preset ${{ matrix.config.preset }} --config ${{ matrix.build_type }}

      - name: Test ${{ matrix.config.preset }}
        run: ctest --preset ${{ matrix.config.preset }} -C ${{ matrix.build_type }} --output-on-failure


  macos:
    name: ${{ matrix.config.name }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

        config:
          - { name: "osx.15-x64", runner: macos-15-intel, preset: "macos-x64" }
          - { name: "osx.15-arm64", runner: macos-15, preset: "macos-arm64" }
          - { name: "osx.26-x64", runner: macos-26-intel, preset: "macos-x64" }
          - { name: "osx.26-arm64", runner: macos-26, preset: "macos-arm64" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      # Note: vcpkg caching disabled for macOS weekly scan to reduce cache storage usage.
      # Different macOS versions have different compiler versions, so caches cannot be shared.

      - name: Install build tools (macOS)
        run: brew install --quiet autoconf automake autoconf-archive

      # TODO: Remove this workaround - see GitHub issue #125
      # Technical debt: technical/debt/macos-jpeg-conflict.md
      - name: Fix JPEG library conflicts (macOS) - TEMPORARY WORKAROUND
        run: |
          echo "=== Unlinking conflicting JPEG packages ==="
          brew unlink jpeg 2>/dev/null || echo "jpeg not linked or not found"
          brew unlink jpeg-turbo 2>/dev/null || echo "jpeg-turbo not linked or not found"
          brew unlink libjpeg 2>/dev/null || echo "libjpeg not linked or not found"

      - name: Bootstrap vcpkg (macOS)
        run: ${{ github.workspace }}/external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Configure
        run: cmake --preset ${{ matrix.config.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DVANILLAPDF_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.config.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.config.preset }} --output-on-failure


  android:
    name: android.${{ matrix.api_level }}-x86_64 - ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]

        # The binaries always target API 28 (the presets' CMAKE_SYSTEM_VERSION,
        # matching the vcpkg android triplets); the matrix picks the Android OS
        # they run on. Testing brackets the supported range: the oldest
        # supported release and the newest image that boots on GPU-less
        # runners. API 37.0 does not: Android 17 images need a Vulkan host
        # stack and hang under software Vulkan (lavapipe), never bringing up
        # adb. The emulator-runner action's own CI tests no further than 35.
        api_level: ["28", "36"]

    env:
      # Consumed by scripts/android/push_test_payload.sh and by the adb wrapper
      # (scripts/android/adb_test_runner.sh) that rewrites host paths to their
      # pushed device-side counterparts
      VANILLAPDF_ANDROID_HOST_ROOT: ${{ github.workspace }}
      VANILLAPDF_ANDROID_DEVICE_ROOT: /data/local/tmp/vanillapdf
      VANILLAPDF_ANDROID_LIBRARY_DIR: ${{ github.workspace }}/build/android-x86_64/src/vanillapdf

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      # KVM exists on GitHub-hosted Linux runners but is not accessible to the
      # runner user by default; without it the emulator falls back to software
      # rendering and boots too slowly to be usable
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Bootstrap vcpkg (Linux)
        run: ./external/vcpkg/bootstrap-vcpkg.sh
        shell: bash

      # ANDROID_NDK_HOME is consumed by the vcpkg android toolchain (ports),
      # CMAKE_ANDROID_NDK by the project build itself. Point both at the
      # runner's latest preinstalled NDK (r28+ aligns 16 KB page sizes by
      # default). Benchmarks are disabled: they are never executed on the
      # emulator and only add dependency build time.
      - name: Configure android-x86_64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cmake --preset android-x86_64 -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" -DVANILLAPDF_ENABLE_TESTS=ON -DVANILLAPDF_ENABLE_BENCHMARK=OFF

      - name: Build android-x86_64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cmake --build --preset android-x86_64

      # The emulator provides the Android OS the cross-compiled binaries need.
      # ctest runs on the host; every test binary invocation is routed through
      # the adb wrapper configured as CMAKE_CROSSCOMPILING_EMULATOR. Only the
      # integration and tools suites run (per suite directory): the unit test
      # suite is skipped because gtest per-case discovery has to execute the
      # binary on the host, which is impossible when cross-compiling.
      - name: Test android-x86_64 on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: ${{ matrix.api_level }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -no-metrics
          disable-animations: false
          script: |
            ./scripts/android/push_test_payload.sh
            ctest --test-dir build/android-x86_64/src/vanillapdf.test --output-on-failure
            ctest --test-dir build/android-x86_64/src/vanillapdf.tools --output-on-failure

