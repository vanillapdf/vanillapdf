version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  apt_packages:
    - doxygen

sphinx:
  configuration: doc/sphinx/conf.py
  # Treat every Sphinx/Breathe warning as an error so no doc defect slips by
  # silently (broken cross-references, malformed directives, parse failures).
  fail_on_warning: true

python:
  install:
    - requirements: doc/sphinx/requirements.txt
